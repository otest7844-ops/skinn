services:
  # Serveur Node.js + Socket.IO
  - type: web
    name: skinn-multiplayer
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm run server
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production

  # Interface React + Vite
  - type: static
    name: skinn-app
    buildCommand: npm ci --include=dev && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_MULTIPLAYER_URL
        fromService:
          type: web
          name: skinn-multiplayer
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
