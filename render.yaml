services:
  - type: web
    name: skinn-multiplayer
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm run server
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22

  - type: web
    name: skinn-app
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_MULTIPLAYER_URL
        fromService:
          type: web
          name: skinn-multiplayer
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
