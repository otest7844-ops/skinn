<!DOCTYPE html> <html lang="fr"> <head> <meta charset="utf-8"> <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"> <title>Tic Tac Toe Arena</title> <style> :root{--bg:#0a0818;color-scheme:dark} html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none} canvas{display:block;width:100%;height:100%} </style> </head> <body> <canvas id="c"></canvas> <script> const cv=document.getElementById('c'),ctx=cv.getContext('2d'); let W,H,S,C,BX,BY;  function resize(){  const d=Math.min(devicePixelRatio||1,2);  W=innerWidth;H=innerHeight;  cv.width=W*d;cv.height=H*d;  ctx.setTransform(d,0,0,d,0,0);  S=Math.min(W*.84,H*.46,520);  C=S/3;BX=(W-S)/2;BY=H*.56-S/2; } addEventListener('resize',resize); resize(); new ResizeObserver(resize).observe(cv); window.addEventListener('pageshow',resize); document.addEventListener('visibilitychange',resize); window.setTimeout(resize,0);  const LN=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];  let board=Array(9).fill(0),an=Array(9).fill(0); let turn=1,state='menu',win=null,wt=0,winner=0; let sc=[0,0,0],starter=2,hover=-1,t0=0,shake=0,flash=0,flashCol='#fff',ps=[];  const emb=Array.from({length:36},()=>({  x:Math.random(),y:Math.random(),  s:Math.random()*2+.6,  v:Math.random()*.05+.015,  c:Math.random()<.5?'#ff6b8a':'#6cc8ff' }));  const ctr=i=>[BX+(i%3+.5)*C,BY+(Math.floor(i/3)+.5)*C]; const cl=(v,a,b)=>Math.max(a,Math.min(b,v));  
let AC=null;  function tone(f0,f1,d,ty,v,dl){  if(!AC)return;  try{   const t=AC.currentTime+(dl||0);   const o=AC.createOscillator(),g=AC.createGain();   o.type=ty;   o.frequency.setValueAtTime(f0,t);   o.frequency.exponentialRampToValueAtTime(f1,t+d);   g.gain.setValueAtTime(v,t);   g.gain.exponentialRampToValueAtTime(.001,t+d);   o.connect(g);g.connect(AC.destination);   o.start(t);o.stop(t+d);  }catch(e){} }  function sfx(k){  if(k==='x')tone(900,500,.09,'triangle',.2);  else if(k==='o')tone(600,380,.1,'sine',.2);  else if(k==='w'){   tone(520,520,.1,'square',.08);   tone(700,700,.1,'square',.08,.1);   tone(960,960,.25,'square',.09,.2);  }  else if(k==='l')tone(320,110,.45,'sawtooth',.08);  else if(k==='d')tone(440,330,.3,'triangle',.12); }  
function burst(x,y,n,col,sp){  for(let i=0;i<n;i++){   const a=Math.random()*6.28,v=(.3+Math.random())*sp*60;   ps.push({    x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-40,    l:.5+Math.random()*.5,c:col   });  } }  
function winOf(b){  for(const l of LN)   if(b[l[0]]&&b[l[0]]===b[l[1]]&&b[l[1]]===b[l[2]])return l;  return null; }  function mm(b,p,d){  const w=winOf(b);  if(w)return b[w[0]]===2?10-d:d-10;  if(b.every(v=>v))return 0;   let best=p===2?-99:99;   for(let i=0;i<9;i++){   if(!b[i]){    b[i]=p;    const v=mm(b,3-p,d+1);    b[i]=0;    best=p===2?Math.max(best,v):Math.min(best,v);   }  }  return best; }  function aiMove(){  if(state!=='play'||turn!==2)return;   const e=[];  for(let i=0;i<9;i++)if(!board[i])e.push(i);  if(!e.length)return;   let m;   if(Math.random()<.2)m=e[Math.random()*e.length|0];  else{   let bs=-99,c=[];   for(const i of e){    board[i]=2;    const v=mm(board,1,1);    board[i]=0;    if(v>bs){bs=v;c=[i];}    else if(v===bs)c.push(i);   }   m=c[Math.random()*c.length|0];  }   place(m,2); }  function place(i,p){  board[i]=p;an[i]=0;   const[cx,cy]=ctr(i);  burst(cx,cy,14,p===1?'#ff7a6b':'#5cc8ff',3);  sfx(p===1?'x':'o');  shake=Math.max(shake,2);   const w=winOf(board);   if(w){   win=w;wt=0;winner=p;state='end';   sc[p-1]++;   flash=.14;   flashCol=p===1?'#ff5a6e':'#46b8ff';   shake=7;    for(const k of w){    const[x,y]=ctr(k);    burst(x,y,22,p===1?'#ff9a8c':'#8ad6ff',4);   }    sfx(p===1?'w':'l');  }  else if(board.every(v=>v)){   state='end';winner=0;sc[2]++;   sfx('d');  }  else{   turn=3-p;   if(turn===2)setTimeout(aiMove,1600);  } }  function newRound(){  board=Array(9).fill(0);  an=Array(9).fill(0);  win=null;winner=0;  starter=3-starter;  turn=starter;  state='play';  if(turn===2)setTimeout(aiMove,1600); }  function cellAt(e){  const x=e.clientX-BX,y=e.clientY-BY;  if(x<0||y<0||x>=S||y>=S)return -1;  return Math.floor(y/C)*3+Math.floor(x/C); }  cv.addEventListener('pointermove',e=>{  hover=cellAt(e); });  cv.addEventListener('pointerdown',e=>{  if(!AC){   try{AC=new(window.AudioContext||window.webkitAudioContext)()}   catch(_){}  }   if(state==='menu'){   sc=[0,0,0];   starter=2;   newRound();  }  else if(state==='end')newRound();  else if(state==='play'&&turn===1){   const i=cellAt(e);   hover=i;   if(i>=0&&!board[i])place(i,1);  } });  
function rr(x,y,w,h,r){  ctx.beginPath();  ctx.roundRect(x,y,w,h,r); }  function text(s,x,y,size,col){  ctx.font=`800 ${size}px system-ui,-apple-system,"Segoe UI",sans-serif`;  ctx.textAlign='center';  ctx.lineJoin='round';  ctx.lineWidth=size*.18;  ctx.strokeStyle='rgba(5,3,15,.8)';  ctx.strokeText(s,x,y);  ctx.fillStyle=col;  ctx.fillText(s,x,y); }  function mark(i,p,a,alpha){  const[cx,cy]=ctr(i),r=C*.27,t=cl(a*1.4,0,1);   ctx.save();  ctx.globalAlpha=alpha;  ctx.lineCap='round';  ctx.lineWidth=C*.1;   if(p===1){   ctx.strokeStyle='#ff7a6b';   ctx.shadowColor='#ff5a6e';   ctx.shadowBlur=14;   ctx.beginPath();    const t1=cl(t*2,0,1),t2=cl(t*2-1,0,1);    ctx.moveTo(cx-r,cy-r);   ctx.lineTo(cx-r+2*r*t1,cy-r+2*r*t1);    if(t2>0){    ctx.moveTo(cx+r,cy-r);    ctx.lineTo(cx+r-2*r*t2,cy-r+2*r*t2);   }   ctx.stroke();  }  else{   ctx.strokeStyle='#5cc8ff';   ctx.shadowColor='#46b8ff';   ctx.shadowBlur=14;   ctx.beginPath();   ctx.arc(cx,cy,r*1.12,-Math.PI/2,-Math.PI/2+6.283*t);   ctx.stroke();  }  ctx.restore(); }  const memoSky=new Image();memoSky.src='/images/memo-sky.svg';
function draw(){  const T=t0;  let g;   ctx.save();   if(shake>.2)   ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);   const hy=H*.3;   
if(memoSky.complete&&memoSky.naturalWidth>0){ctx.drawImage(memoSky,-20,-20,W+40,H+40)}else{g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#7fdcfa');g.addColorStop(1,'#4fcaf5');ctx.fillStyle=g;ctx.fillRect(-20,-20,W+40,H+40)}   
   
   
   
ctx.save();  ctx.fillStyle='rgba(10,6,28,.75)';  rr(BX-16,BY-16,S+32,S+32,28);  ctx.fill();   const lg=ctx.createLinearGradient(BX,0,BX+S,0);  lg.addColorStop(0,'#ff5a6e');  lg.addColorStop(.5,'#b57bff');  lg.addColorStop(1,'#46b8ff');   ctx.strokeStyle=lg;  ctx.lineWidth=2.5;  ctx.shadowColor='#b57bff';  ctx.shadowBlur=16;  ctx.stroke();  ctx.restore();   
ctx.save();  ctx.lineCap='round';  ctx.lineWidth=4;  ctx.strokeStyle='#7dffe0';  ctx.shadowColor='#5dffb0';  ctx.shadowBlur=10;  ctx.beginPath();   for(let k=1;k<3;k++){   ctx.moveTo(BX+k*C,BY+C*.1);   ctx.lineTo(BX+k*C,BY+S-C*.1);   ctx.moveTo(BX+C*.1,BY+k*C);   ctx.lineTo(BX+S-C*.1,BY+k*C);  }   ctx.stroke();  ctx.restore();   

  if(state==='play'&&turn===1&&hover>=0&&!board[hover])   mark(hover,1,1,.28);   
for(let i=0;i<9;i++){   if(board[i]){    const wn=win&&win.includes(i);    mark(i,board[i],an[i],wn?.7+.3*Math.sin(T*8):1);   }  }   
if(win){   const[x1,y1]=ctr(win[0]);   const[x2,y2]=ctr(win[2]);   const t=cl(wt*1.1,0,1);   const col=winner===1?'#ff9a8c':'#8ad6ff';    ctx.save();   ctx.lineCap='round';   ctx.lineWidth=C*.07;   ctx.strokeStyle='#fff';   ctx.shadowColor=col;   ctx.shadowBlur=22;   ctx.beginPath();   ctx.moveTo(x1,y1);   ctx.lineTo(x1+(x2-x1)*t,y1+(y2-y1)*t);   ctx.stroke();   ctx.restore();  }   
ctx.save();  ctx.globalCompositeOperation='lighter';   for(const p of ps){   ctx.globalAlpha=Math.max(0,p.l*1.6);   ctx.fillStyle=p.c;   ctx.beginPath();   ctx.arc(p.x,p.y,2.4,0,7);   ctx.fill();  }   
ctx.globalAlpha=.25;   for(const e of emb){   const y=((e.y-T*e.v)%1+1)%1;   ctx.fillStyle=e.c;   ctx.beginPath();   ctx.arc(e.x*W+Math.sin(T+e.x*9)*10,y*H,e.s,0,7);   ctx.fill();  }   ctx.restore();   
g=ctx.createRadialGradient(   W/2,H/2,Math.min(W,H)*.3,   W/2,H/2,Math.max(W,H)*.75  );  g.addColorStop(0,'rgba(0,0,0,0)');  g.addColorStop(1,'rgba(0,0,10,.6)');  ctx.fillStyle=g;  ctx.fillRect(-20,-20,W+40,H+40);   
const w=Math.min(W-24,300),x=W/2-w/2,y=34;   ctx.save();  ctx.fillStyle='rgba(10,6,28,.82)';  rr(x,y,w,52,26);  ctx.fill();   const lg2=ctx.createLinearGradient(x,0,x+w,0);  lg2.addColorStop(0,'#ff5a6e');  lg2.addColorStop(.5,'#b57bff');  lg2.addColorStop(1,'#46b8ff');   ctx.strokeStyle=lg2;  ctx.lineWidth=2;  ctx.shadowColor='#b57bff';  ctx.shadowBlur=14;  ctx.stroke();  ctx.restore();   ctx.font='700 14px system-ui,-apple-system,sans-serif';  ctx.textAlign='left';  ctx.fillStyle='#ff8a7c';  ctx.fillText('Vous (X)',x+26,y+31);   ctx.textAlign='right';  ctx.fillStyle='#74d3ff';  ctx.fillText('IA (O)',x+w-26,y+31);   ctx.fillStyle='#fff';  ctx.font='800 28px system-ui,-apple-system,sans-serif';  ctx.textAlign='center';  ctx.fillText(sc[0]+' : '+sc[1],W/2,y+36);   text('Nuls : '+sc[2],W/2,y+80,15,'#c9b8ff');   if(state==='play')   text(    turn===1?'À vous de jouer':'L’IA réfléchit…',    W/2,BY-34,22,    turn===1?'#ffb3a8':'#a6defc'   );   const my=BY+S+64;   if(state==='end'){   const m=winner===1?'Victoire !':winner===2?'Défaite':'Match nul';   text(m,W/2,my,38,    winner===1?'#ffd36e':winner===2?'#8ad6ff':'#fff'   );   text('Touchez pour rejouer',W/2,my+36,20,'#ffd36e');  }   if(state==='menu'){   ctx.fillStyle='rgba(5,3,15,.55)';   ctx.fillRect(-20,-20,W+40,H+40);    text('TIC TAC TOE',W/2,H*.3,Math.min(52,W*.12),'#fff');   text('ARENA',W/2,H*.3+42,Math.min(34,W*.09),'#b57bff');   text('Touchez pour jouer',W/2,H*.3+92,22,'#ffd36e');   text('Alignez 3 symboles avant l’IA',W/2,H*.3+124,15,'#e8eefc');  }   ctx.restore();   if(flash>.02){   ctx.globalAlpha=flash;   ctx.fillStyle=flashCol;   ctx.fillRect(0,0,W,H);   ctx.globalAlpha=1;  } }  
let last=performance.now();  function loop(now){  const dt=Math.min(.033,(now-last)/1000)||.016;  last=now;  t0+=dt;   for(let i=0;i<9;i++)   if(board[i])an[i]+=dt*1.1;   if(win)wt+=dt;   for(const p of ps){   p.vy+=300*dt;   p.x+=p.vx*dt;   p.y+=p.vy*dt;   p.l-=dt;  }   ps=ps.filter(p=>p.l>0);  shake*=.88;  flash*=.9;   if(state==='end'&&winner===1&&Math.random()<.1){   burst(    Math.random()*W,    H*.2+Math.random()*H*.3,    16,    ['#ffd36e','#ff6b9d','#7dffb5'][Math.random()*3|0],    3   );  }   draw();  requestAnimationFrame(loop); }  requestAnimationFrame(loop); </script> </body> </html>
