<style>
:root{--bg:#1a1410;--fg:#f3e9d6;--panel:rgba(26,20,16,.78);--accent:#d9a45b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

#sc b{color:var(--accent);font-size:18px}
#st{font-style:italic}

html,body{background:radial-gradient(ellipse at 50% 38%,#26262c 0%,#121216 50%,#050507 100%)}

#lv{position:absolute;left:0;right:0;top:calc(36px + env(safe-area-inset-top,0px));text-align:center;font:900 22px/1.35 'Arial Black',Arial,sans-serif;color:#fff;letter-spacing:.5px}#lv b{color:#ff4040}
#md{position:absolute;right:24px;top:0;width:54px;height:calc(98px + env(safe-area-inset-top,0px));border:0;border-radius:0;padding:env(safe-area-inset-top,0px) 0 14px;background:linear-gradient(90deg,#a00,#ec3322,#a00);clip-path:polygon(0 0,100% 0,100% 100%,50% 88%,0 100%);color:#fff;font-size:38px;display:flex;align-items:center;justify-content:center}
#bk{position:fixed;left:14px;top:calc(122px + env(safe-area-inset-top,0px));width:34px;filter:drop-shadow(0 2px 2px #0008)}
#hud{top:calc(112px + env(safe-area-inset-top,0px));left:64px;right:20px;padding:0;align-items:center;text-align:center;font-family:Arial,sans-serif;color:#cfe9e4}
.bar{background:none;border:0;backdrop-filter:none;padding:0;justify-content:center;font-size:15px}#sc b{color:#ff4a4a}
#btns2{position:fixed;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-around;padding:0 6px}

.sd em{position:absolute;left:50%;top:2px;font:900 22px Arial;font-style:normal;color:#2cff6a;opacity:0;transform:translate(-50%,0)}
.sd em.go{animation:up .9s ease-out}@keyframes up{0%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-34px)}}
.sv b.pop{animation:pop .45s}@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.5);color:#2cff6a}100%{transform:scale(1)}}

</style></head><body>
<div id="top"><svg id="av" viewBox="0 0 100 100"><defs><clipPath id="cp"><circle cx="50" cy="50" r="42"/></clipPath></defs><circle cx="50" cy="50" r="46" fill="#d81f26"/><circle cx="50" cy="50" r="42" fill="#2b2b33"/><g clip-path="url(#cp)"><path d="M10 100q10-30 40-30t40 30z" fill="#1d1d24"/><rect x="42" y="58" width="16" height="14" fill="#d9a77d"/><ellipse cx="50" cy="44" rx="15" ry="18" fill="#e8b98f"/><path d="M34 40q2-18 18-17t14 17q-6-8-16-8t-16 8z" fill="#3a2418"/><g fill="none" stroke="#222" stroke-width="2"><circle cx="43" cy="44" r="5"/><circle cx="57" cy="44" r="5"/><path d="M48 44h4"/></g></g></svg><div id="lv"><b>NIVEAU 1</b><br><span id="lv2">DÉBUTANT</span></div><button id="md" aria-label="Réglages">⚙</button></div><svg id="bk" viewBox="0 0 60 70"><polygon points="42,0 0,35 42,70 60,52 33,35 60,18" fill="#d81f26" stroke="#7a0a10" stroke-width="2"/></svg>
<div id="hud"><div class="bar"><span id="sc" style="display:none"></span><div id="sbd"><div class="sd r" id="sd-w"><div class="sl">ROUGES</div><div class="sv"><b id="sn-w">0</b><small>/10</small></div><div class="sbar"><i id="sb-w"></i></div><em id="sp-w">+1</em></div><div class="sm"><span id="tm">⏱ 0:00.0</span><small>PREMIER À 10</small></div><div class="sd k" id="sd-b"><div class="sl">NOIRS</div><div class="sv"><b id="sn-b">0</b><small>/10</small></div><div class="sbar"><i id="sb-b"></i></div><em id="sp-b">+1</em></div></div></div><div class="bar"><span id="st"></span></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=id=>document.getElementById(id);
// ---------- Règles ----------
const V={P:1,N:3,B:3,R:5,Q:9,K:100};
function moves(b,i){const p=b[i];if(!p)return[];const col=p[0],t=p[1],r=i>>3,c=i&7,out=[];
 const add=(rr,cc)=>{if(rr<0||rr>7||cc<0||cc>7)return false;const j=rr*8+cc,q=b[j];if(q&&q[0]===col)return false;out.push(j);return !q};
 const slide=ds=>ds.forEach(([dr,dc])=>{let rr=r+dr,cc=c+dc;while(add(rr,cc)){rr+=dr;cc+=dc}});
 const D=[[1,1],[1,-1],[-1,1],[-1,-1]],O=[[1,0],[-1,0],[0,1],[0,-1]];
 if(t==='P'){const d=col==='w'?-1:1,s=col==='w'?6:1,f=(r+d)*8+c;
  if(r+d>=0&&r+d<8){if(!b[f]){out.push(f);if(r===s&&!b[f+d*8])out.push(f+d*8)}
   [-1,1].forEach(dc=>{const cc=c+dc;if(cc<0||cc>7)return;const j=(r+d)*8+cc;if(b[j]&&b[j][0]!==col)out.push(j)})}}
 else if(t==='N')[[2,1],[2,-1],[-2,1],[-2,-1],[1,2],[1,-2],[-1,2],[-1,-2]].forEach(([a,d])=>add(r+a,c+d));
 else if(t==='K')D.concat(O).forEach(([a,d])=>add(r+a,c+d));
 else if(t==='B')slide(D);else if(t==='R')slide(O);else slide(D.concat(O));
 return out}
function check(b,col){const k=b.indexOf(col+'K');return b.some((p,i)=>p&&p[0]!==col&&moves(b,i).includes(k))}
function lg(b,i){const col=b[i][0];return moves(b,i).filter(j=>{const nb=b.slice();nb[j]=nb[i];nb[i]=null;return !check(nb,col)})}
const anyMove=(b,col)=>b.some((p,i)=>p&&p[0]===col&&lg(b,i).length);

// ---------- Scène ----------
const ren=new THREE.WebGLRenderer({antialias:true,alpha:true});ren.setPixelRatio(Math.min(devicePixelRatio,2));
ren.shadowMap.enabled=true;ren.shadowMap.type=THREE.PCFSoftShadowMap;ren.toneMapping=THREE.ACESFilmicToneMapping;ren.toneMappingExposure=1.15;ren.outputEncoding=THREE.sRGBEncoding;
document.body.prepend(ren.domElement);
const scene=new THREE.Scene();
const cam=new THREE.PerspectiveCamera(42,1,.1,100);
scene.add(new THREE.HemisphereLight(0xffffff,0x3a4a4a,.9));
const sun=new THREE.DirectionalLight(0xffffff,1.5);sun.position.set(-5,11,6);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-9,right:9,top:9,bottom:-9,near:1,far:30});sun.shadow.bias=-.0005;scene.add(sun);
const pl=new THREE.PointLight(0xffc27a,.6,30);pl.position.set(5,6,-5);scene.add(pl);

function wood(c1,c2,n=90){const cv=document.createElement('canvas');cv.width=cv.height=256;const x=cv.getContext('2d');x.fillStyle=c1;x.fillRect(0,0,256,256);
 for(let i=0;i<n;i++){x.strokeStyle=c2;x.globalAlpha=Math.random()*.2;x.lineWidth=Math.random()*3+.5;const y=Math.random()*256;x.beginPath();x.moveTo(0,y);x.bezierCurveTo(80,y+Math.random()*14-7,170,y+Math.random()*14-7,256,y+Math.random()*10-5);x.stroke()}
 const t=new THREE.CanvasTexture(cv);t.encoding=THREE.sRGBEncoding;return t}
const mat=(t,r)=>new THREE.MeshStandardMaterial({map:t,roughness:r,metalness:.05});
const mL=mat(wood('#d9d4c8','#b8b2a2',50),.45),mD=mat(wood('#242428','#3a3a40',60),.45),mF=mat(wood('#222226','#4a4a50',100),.4);
const table=new THREE.Mesh(new THREE.PlaneGeometry(60,60),new THREE.ShadowMaterial({opacity:.35}));table.rotation.x=-Math.PI/2;table.position.y=-.42;table.receiveShadow=true;scene.add(table);
const frame=new THREE.Mesh(new THREE.BoxGeometry(8.4,.44,8.4),mF);frame.position.y=-.22-.03;frame.receiveShadow=true;frame.castShadow=true;scene.add(frame);
const sq=[];
for(let i=0;i<64;i++){const r=i>>3,c=i&7;const m=new THREE.Mesh(new THREE.BoxGeometry(1,.1,1),(r+c)%2?mD:mL);m.position.set(c-3.5,-.05,r-3.5);m.receiveShadow=true;m.userData.sq=i;scene.add(m);sq.push(m)}
const pos=i=>new THREE.Vector3((i&7)-3.5,0,(i>>3)-3.5);
function lab(t,i,dx,dz,col){const cv=document.createElement('canvas');cv.width=cv.height=64;const x=cv.getContext('2d');x.font='bold 40px Arial';x.fillStyle=col;x.textAlign='center';x.textBaseline='middle';x.fillText(t,32,34);const m=new THREE.Mesh(new THREE.PlaneGeometry(.26,.26),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(cv),transparent:true}));m.rotation.x=-Math.PI/2;m.position.copy(pos(i));m.position.x+=dx;m.position.z+=dz;m.position.y=.006;scene.add(m)}
for(let k=0;k<8;k++){lab(8-k,k*8,-.32,-.32,k%2?'#fff':'#222');lab('abcdefgh'[k],56+k,.32,.32,(7+k)%2?'#fff':'#222')}

// ---------- Pièces ----------
const L=(p,s=40)=>new THREE.LatheGeometry(p.map(a=>new THREE.Vector2(a[0],a[1])),s);
const pm={w:new THREE.MeshPhysicalMaterial({color:0x8a0f14,roughness:.3,metalness:.1,clearcoat:.7,clearcoatRoughness:.2}),
 b:new THREE.MeshPhysicalMaterial({color:0x131316,roughness:.22,metalness:.25,clearcoat:.8,clearcoatRoughness:.15})};
const bs=[[0,0],[.37,0],[.39,.05],[.35,.1],[.26,.17]];
const P={
 P:()=>[L([[0,0],[.34,0],[.36,.05],[.33,.1],[.22,.16],[.14,.3],[.13,.42],[.2,.46],[.2,.5],[.1,.52],[0,.52]]),[new THREE.SphereGeometry(.18,24,16),0,.66,0]],
 R:()=>{const o=[L(bs.concat([[.22,.5],[.25,.58],[.32,.64],[.32,.8],[.22,.8],[.22,.72],[0,.72]]))];
  for(let k=0;k<6;k++){const g=new THREE.BoxGeometry(.1,.14,.1);o.push([g,Math.cos(k*Math.PI/3)*.27,.87,Math.sin(k*Math.PI/3)*.27,k*Math.PI/3])}return o},
 B:()=>[L(bs.concat([[.14,.35],[.13,.55],[.22,.6],[.2,.64],[.1,.66],[0,.66]])),[new THREE.SphereGeometry(.19,24,16).scale(1,1.4,1),0,.9,0],[new THREE.SphereGeometry(.06,12,10),0,1.2,0]],
 Q:()=>[L(bs.concat([[.16,.45],[.15,.7],[.26,.78],[.3,.9],[.22,.94],[.34,1.05],[.3,1.1],[0,1.1]])),[new THREE.SphereGeometry(.1,16,12),0,1.2,0]],
 K:()=>[L(bs.concat([[.17,.45],[.16,.75],[.28,.82],[.3,.95],[.2,1],[.3,1.08],[0,1.08]])),[new THREE.BoxGeometry(.09,.34,.09),0,1.3,0],[new THREE.BoxGeometry(.24,.09,.09),0,1.34,0]],
 N:()=>[L([[0,0],[.37,0],[.39,.05],[.35,.1],[.28,.15],[.26,.22],[0,.22]]),[new THREE.BoxGeometry(.3,.6,.24),0,.52,-.02,0,0,.12],[new THREE.BoxGeometry(.26,.22,.5),0,.84,.15,0,-.35,0],[new THREE.ConeGeometry(.06,.16,8),-.08,1.02,-.08],[new THREE.ConeGeometry(.06,.16,8),.08,1.02,-.08]]
};
function mk(t,col){const g=new THREE.Group();
 for(const e of P[t]()){const geo=Array.isArray(e)?e[0]:e;const m=new THREE.Mesh(geo,pm[col]);if(Array.isArray(e)){m.position.set(e[1],e[2],e[3]);if(e[4])m.rotation.y=e[4];if(e[5])m.rotation.x=e[5];if(e[6])m.rotation.z=e[6]}m.castShadow=m.receiveShadow=true;g.add(m)}
 if(t==='N'&&col==='w')g.rotation.y=Math.PI;return g}

// ---------- État ----------
let B,M,turn,sel,legal,score,over,busy,vsAI=true,cap;
const hlG=new THREE.Group();scene.add(hlG);
const hm=c=>new THREE.MeshBasicMaterial({color:c,transparent:true,opacity:.75,depthWrite:false});
function hl(){M.forEach((m,i)=>{if(m)m.position.y=i===sel?.14:0});hlG.clear();const add=(g,c,i)=>{const m=new THREE.Mesh(g,hm(c));m.rotation.x=-Math.PI/2;m.position.copy(pos(i));m.position.y=.02;hlG.add(m)};
 if(!over&&check(B,turn)){const k=B.indexOf(turn+'K');add(new THREE.RingGeometry(.3,.47,32),0xff3030,k)}
 if(sel!==null){add(new THREE.RingGeometry(.32,.46,32),B[sel][0]==='w'?0xff2a2a:0xffffff,sel);if(hintTo!==null)(B[hintTo]?add(new THREE.RingGeometry(.34,.47,32),0xff5a3c,hintTo):add(new THREE.CircleGeometry(.14,24),0x6be07a,hintTo))}}
function ui(msg){sb();$('sc').innerHTML='Rouges <b>'+score.w+'</b>/10 · Noirs <b>'+score.b+'</b>/10';$('st').textContent=msg}
function newGame(){if(M)M.forEach(m=>m&&scene.remove(m));if(cap&&cap.m)cap.m.forEach(m=>scene.remove(m));
 B=Array(64).fill(null);M=Array(64).fill(null);const bk='RNBQKBNR';
 for(let i=0;i<8;i++){B[i]='b'+bk[i];B[8+i]='bP';B[48+i]='wP';B[56+i]='w'+bk[i]}
 B.forEach((p,i)=>{if(p){const m=mk(p[1],p[0]);m.position.copy(pos(i));m.userData.sq=i;scene.add(m);M[i]=m}});
 turn='w';sel=null;legal=[];score={w:0,b:0};over=false;busy=false;cap={w:0,b:0,m:[],l:{w:[],b:[]}};T.length=0;H.length=0;hints=6;$('bd').textContent=6;hintTo=null;T0=0;TE=0;hl();ui('Premier à 10 pièces ! Aux Rouges')}
function restore(s){T.length=0;M.forEach(m=>m&&scene.remove(m));cap.m.forEach(m=>scene.remove(m));B=s.B.slice();M=Array(64).fill(null);
 B.forEach((p,i)=>{if(p){const m=mk(p[1],p[0]);m.position.copy(pos(i));m.userData.sq=i;scene.add(m);M[i]=m}});
 score=s.score;turn=s.turn;sel=null;legal=[];over=false;TE=0;hintTo=null;busy=false;cap={w:s.l.w.length,b:s.l.b.length,m:[],l:{w:s.l.w.slice(),b:s.l.b.slice()}};
 ['w','b'].forEach(c=>cap.l[c].forEach((t,n)=>{const m=mk(t[1],t[0]);m.scale.setScalar(.5);m.rotation.x=(c==='w'?1:-1)*Math.PI/2;m.position.copy(tp(c,n));scene.add(m);cap.m.push(m)}));hl();ui(turn==='w'?'Aux Rouges de jouer':'Aux Noirs de jouer')}

// ---------- Animation ----------
const T=[],H=[],FX=[],clock=new THREE.Clock();let hints=6,AC,hintTo=null,T0=0,TE=0;const ps={w:0,b:0};
function sb(){['w','b'].forEach(c=>{const n=score[c],e=$('sn-'+c);e.textContent=n;$('sb-'+c).style.width=Math.min(100,n*10)+'%';
 if(n>ps[c])[e,$('sp-'+c),$('sd-'+c)].forEach((x,k)=>{const cl=['pop','go','fl'][k];x.classList.remove(cl);void x.offsetWidth;x.classList.add(cl)});ps[c]=n})}const elp=()=>T0?(TE||performance.now())-T0:0,fmt=ms=>{const s=ms/1000;return Math.floor(s/60)+':'+(s%60).toFixed(1).padStart(4,'0')};setInterval(()=>{$('tm').textContent='⏱ '+fmt(elp())},100);
const tp=(c,n)=>new THREE.Vector3(-3.2+(n%16)*.43,.2,c==='w'?4.9:-4.9);
function burst(i,col,n){const g=new THREE.Group();g.position.copy(pos(i));g.position.y=.03;scene.add(g);
 const bm=o=>new THREE.MeshBasicMaterial({color:col,transparent:true,depthWrite:false,side:THREE.DoubleSide,...o});
 const ring=new THREE.Mesh(new THREE.RingGeometry(.2,.34,40),bm());ring.rotation.x=-Math.PI/2;g.add(ring);
 const pl=new THREE.Mesh(new THREE.PlaneGeometry(.96,.96),bm({opacity:.7}));pl.rotation.x=-Math.PI/2;pl.position.y=-.01;g.add(pl);
 const ps=[];for(let k=0;k<n;k++){const p=new THREE.Mesh(new THREE.SphereGeometry(.055,8,6),bm());const a=Math.random()*6.28,s=1+Math.random()*1.6;p.userData.v=[Math.cos(a)*s,2+Math.random()*2.2,Math.sin(a)*s];g.add(p);ps.push(p)}
 FX.push({g,ring,pl,ps,t:0,dur:.6})}
function snd(k){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();const t=AC.currentTime;
 const tone=(f,t0,d,w,v,f2)=>{const o=AC.createOscillator(),g=AC.createGain();o.type=w;o.frequency.setValueAtTime(f,t+t0);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+t0+d);g.gain.setValueAtTime(v,t+t0);g.gain.exponentialRampToValueAtTime(.001,t+t0+d);o.connect(g);g.connect(AC.destination);o.start(t+t0);o.stop(t+t0+d)};
 if(k==='ok')tone(420,0,.07,'triangle',.18,200);
 else if(k==='cap'){tone(260,0,.14,'square',.12,90);tone(660,.1,.12,'triangle',.2);tone(990,.2,.2,'triangle',.2)}
 else{tone(170,0,.13,'square',.2);tone(170,.18,.2,'square',.2)}}catch(e){}}
function bad(i){burst(i,0xff2a2a,0);snd('bad');const s=$('st'),o=s.textContent;s.textContent='Coup impossible';setTimeout(()=>{if(s.textContent==='Coup impossible')s.textContent=o},900)}
function tw(m,to,dur,arc,s1,cb,rz,w){T.push({m,f:m.position.clone(),to,t:0,dur,arc,s0:m.scale.x,s1,cb,r0:m.rotation.x,rz,w:w||0})}
function doMove(a,b){H.push({B:B.slice(),score:{...score},turn,l:{w:cap.l.w.slice(),b:cap.l.b.slice()}});busy=true;sel=null;legal=[];const p=B[a],m=M[a],c=B[b];if(!T0)T0=performance.now();if(!c)snd('ok');
 if(c){score[p[0]]++;const cm=M[b],n=cap[p[0]]++;cap.m.push(cm);cap.l[p[0]].push(c);setTimeout(()=>{burst(b,0x2cff6a,18);snd('cap')},140);
  tw(cm,tp(p[0],n),.45,1.2,.5,null,(p[0]==='w'?1:-1)*Math.PI/2,.14)}
 B[b]=p;B[a]=null;M[b]=m;M[a]=null;m.userData.sq=b;
 const promo=p[1]==='P'&&(b>>3===0||b>>3===7);if(promo)B[b]=p[0]+'Q';
 tw(m,pos(b),.22,p[1]==='N'?.8:.25,1,()=>{
  if(promo){scene.remove(m);const q=mk('Q',p[0]);q.position.copy(pos(b));q.userData.sq=b;scene.add(q);M[b]=q}
  turn=turn==='w'?'b':'w';const ok=anyMove(B,turn),ch=check(B,turn);let msg;
  if(!ok){over=true;msg=ch?'Échec et mat ! '+(turn==='w'?'Les Noirs':'Les Rouges')+' gagnent':'Pat — partie nulle'}
  else msg=(ch?'Échec ! ':'')+(turn==='w'?'Aux Rouges de jouer':'Aux Noirs de jouer');
  if(score[p[0]]>=10)over=true;if(over&&!TE)TE=performance.now();if(score[p[0]]>=10)msg=(p[0]==='w'?'Les Rouges':'Les Noirs')+' gagnent : 10 pièces en '+fmt(elp())+' !';busy=false;hl();ui(msg);if(!over&&vsAI&&turn==='b'){busy=true;setTimeout(()=>{busy=false;ai()},120)}})}
function ai(hint){const C=hint?turn:'b',O=C==='w'?'b':'w';const all=[];for(let i=0;i<64;i++)if(B[i]&&B[i][0]===C)lg(B,i).forEach(j=>all.push([i,j]));if(!all.length)return;
 let best=-1e9,pk;for(const[a,b]of all){const nb=B.slice();const g=nb[b]?V[nb[b][1]]:0;nb[b]=nb[a];nb[a]=null;let w=0;
  for(let i=0;i<64;i++)if(nb[i]&&nb[i][0]===O)for(const j of moves(nb,i))if(nb[j])w=Math.max(w,V[nb[j][1]]);
  let tq=0;if(hint)for(const j of moves(nb,b))if(nb[j]&&nb[j][0]===O)tq=Math.max(tq,1+V[nb[j][1]]*.2);const s=(hint&&g?g+3:g)-w+tq+Math.random()*(hint?.05:.6)+(B[a][1]==='P'&&b>>3===(C==='b'?7:0)?8:0);if(s>best){best=s;pk=[a,b]}}
 return hint?pk:doMove(pk[0],pk[1])}

// ---------- Caméra & interaction ----------
let th=0,ph=1.22,dist=innerWidth<innerHeight?13.8:13;const tg=new THREE.Vector3(0,.2,-.5);
function setCam(){cam.position.set(tg.x+dist*Math.cos(ph)*Math.sin(th),tg.y+dist*Math.sin(ph),tg.z+dist*Math.cos(ph)*Math.cos(th));cam.lookAt(tg)}
function resize(){ren.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.fov=cam.aspect<1?2*Math.atan(Math.tan(.34)/cam.aspect)*180/Math.PI:42;cam.updateProjectionMatrix()}
addEventListener('resize',resize);
const ptr=new Map();let moved=0,pd=0;const el=ren.domElement;
el.addEventListener('pointerdown',e=>{el.setPointerCapture(e.pointerId);ptr.set(e.pointerId,[e.clientX,e.clientY]);moved=0;if(ptr.size===2){const [a,b]=[...ptr.values()];pd=Math.hypot(a[0]-b[0],a[1]-b[1])}});
el.addEventListener('pointermove',e=>{if(!ptr.has(e.pointerId))return;const o=ptr.get(e.pointerId);const dx=e.clientX-o[0],dy=e.clientY-o[1];ptr.set(e.pointerId,[e.clientX,e.clientY]);moved+=Math.abs(dx)+Math.abs(dy);
 if(ptr.size===2){const [a,b]=[...ptr.values()];const d=Math.hypot(a[0]-b[0],a[1]-b[1]);dist=Math.min(22,Math.max(7,dist*pd/d));pd=d}
 else{th-=dx*.006;ph=Math.min(1.45,Math.max(.25,ph+dy*.005))}setCam()});
el.addEventListener('wheel',e=>{dist=Math.min(22,Math.max(7,dist+e.deltaY*.01));setCam()},{passive:true});
const rc=new THREE.Raycaster(),v2=new THREE.Vector2();el.addEventListener('pointercancel',e=>ptr.delete(e.pointerId));
el.addEventListener('pointerup',e=>{const was=ptr.size;ptr.delete(e.pointerId);if(moved>25||was>1||busy||over)return;
 const R=el.getBoundingClientRect();v2.set((e.clientX-R.left)/R.width*2-1,-((e.clientY-R.top)/R.height)*2+1);rc.setFromCamera(v2,cam);
 const h=rc.intersectObjects(sq.concat(M.filter(Boolean)),true)[0];if(!h)return;let o=h.object;while(o&&o.userData.sq===undefined)o=o.parent;if(!o)return;click(o.userData.sq)});
function click(i){hintTo=null;if(sel!==null&&legal.includes(i)){hl();doMove(sel,i);hlG.clear();return}
 if(B[i]&&B[i][0]===turn&&(!vsAI||turn==='w')){sel=i;legal=lg(B,i);if(!legal.length)bad(i)}else{if(sel!==null)bad(i);sel=null;legal=[]}hl()}
$('nw').onclick=()=>newGame();
$('md').onclick=()=>{vsAI=!vsAI;$('lv2').textContent=vsAI?'DÉBUTANT':'2 JOUEURS';newGame()};
$('un').onclick=()=>{if(busy||!H.length)return;let s=H.pop();if(vsAI&&s.turn==='b'&&H.length)s=H.pop();restore(s)};
$('hn').onclick=()=>{if(busy||over||hints<1||(vsAI&&turn==='b'))return;const pk=ai(true);if(!pk)return;hints--;$('bd').textContent=hints;sel=pk[0];legal=lg(B,sel);hintTo=pk[1];hl();$('st').textContent=B[pk[1]]?'Indice : cette pièce peut tomber !':'Indice : approchez-vous pour attaquer'};
let sty=0;$('pc').onclick=()=>{sty^=1;pm.w.color.set(sty?0xe8d3a8:0x8a0f14);pm.b.color.set(sty?0x3a2314:0x131316)};
function loop(){requestAnimationFrame(loop);const dt=Math.min(clock.getDelta(),.05);
 for(let k=T.length-1;k>=0;k--){const a=T[k];if(a.w>0){a.w-=dt;continue}a.t=Math.min(1,a.t+dt/a.dur);const e=a.t<.5?2*a.t*a.t:1-Math.pow(-2*a.t+2,2)/2;
  a.m.position.lerpVectors(a.f,a.to,e);a.m.position.y+=Math.sin(Math.PI*e)*a.arc;a.m.scale.setScalar(a.s0+(a.s1-a.s0)*e);if(a.rz!==undefined)a.m.rotation.x=a.r0+(a.rz-a.r0)*e;
  if(a.t>=1){T.splice(k,1);a.cb&&a.cb()}}
 for(let k=FX.length-1;k>=0;k--){const f=FX[k];f.t+=dt;const u=Math.min(1,f.t/f.dur);f.ring.scale.setScalar(1+u*3);f.ring.material.opacity=1-u;f.pl.material.opacity=.7*(1-u);f.ps.forEach(p=>{const v=p.userData.v;p.position.set(v[0]*f.t,Math.max(0,v[1]*f.t-4.5*f.t*f.t),v[2]*f.t);p.material.opacity=1-u});if(u>=1){scene.remove(f.g);FX.splice(k,1)}}
 ren.render(scene,cam)}
resize();setCam();newGame();loop();
