<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Le Pont de la Forêt 3D</title>
<style>
:root{--gold:#ffe082}
html,body{margin:0;height:100%;overflow:hidden;background:#c9d6a8;font-family:Georgia,'Times New Roman',serif;color:#f6efdc}
canvas{display:block;touch-action:none}
.ui{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 8px) 12px 0;pointer-events:none;max-width:520px;margin:0 auto}
.top{display:flex;gap:8px;align-items:stretch}
.card,#msg{background:rgba(40,28,16,.68);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:2px solid rgba(255,255,255,.15);border-radius:14px;padding:6px 10px;transition:.3s}
.card{flex:1;font-size:12px;display:flex;align-items:center;gap:8px;border-left:7px solid var(--pc,#fff)}
.card b{display:block;font-size:14px}
.card.on{box-shadow:0 0 0 2px var(--gold),0 0 16px #ffe08099}
#re{pointer-events:auto;border:0;border-radius:14px;width:44px;background:var(--gold);color:#4a3012;font-size:22px;font-weight:bold;cursor:pointer;box-shadow:0 4px 0 #b8963a}
#msg{margin-top:6px;text-align:center;font-size:14px;min-height:38px;display:grid;place-items:center}
</style>
</head>
<body>
<div class="ui"><div class="top"><div class="card" id="c0"></div><button id="re" title="Nouvelle partie">↻</button><div class="card" id="c1"></div></div><div id="msg"></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const R=8,C=5,DX=1.2,DZ=1.25,E=['🦊','🐻'],NM=['Rouge','Bleu'],CH=[0xe53935,0x1e88e5],CS=['#e53935','#1e88e5'],FOG=0xc9d6a8;
const $=id=>document.getElementById(id),rnd=(a,b)=>a+Math.random()*(b-a);
const scene=new THREE.Scene();scene.background=new THREE.Color(FOG);scene.fog=new THREE.FogExp2(FOG,.014);
const cam=new THREE.PerspectiveCamera(45,1,.1,150);
const ren=new THREE.WebGLRenderer({antialias:true});
ren.setPixelRatio(Math.min(devicePixelRatio,2));ren.shadowMap.enabled=true;ren.shadowMap.type=THREE.PCFSoftShadowMap;
ren.toneMapping=THREE.ACESFilmicToneMapping;ren.toneMappingExposure=1.1;ren.outputEncoding=THREE.sRGBEncoding;document.body.appendChild(ren.domElement);
function tex(draw,rep){const c=document.createElement('canvas');c.width=c.height=256;draw(c.getContext('2d'));const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rep,rep);t.encoding=THREE.sRGBEncoding;t.anisotropy=4;return t}
const moss=(b,l1,l2,rep)=>tex(g=>{g.fillStyle=b;g.fillRect(0,0,256,256);for(let i=0;i<2400;i++){g.fillStyle=Math.random()<.6?l1:l2;g.beginPath();g.arc(rnd(0,256),rnd(0,256),rnd(1,3),0,7);g.fill()}},rep);
const MM=(map,o)=>new THREE.MeshStandardMaterial(Object.assign({map,bumpMap:map,bumpScale:1.5,roughness:.95},o));
const mat=(c,o)=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.7},o));
const dirtC=MM(moss('#6b4a2b','#8a6038','#3e2815',5)),grassM=MM(moss('#4f8f2e','#8bd04a','#2f6a1e',6)),dirtG=MM(moss('#4a3220','#6a4a2c','#2a1a0c',40)),leafM=MM(moss('#2f7a2a','#5cb83c','#1f5a1c',2),{flatShading:true});
// lumière, sol, falaises
scene.add(new THREE.HemisphereLight(0xfff4d6,0x5a4630,.95));
const sun=new THREE.DirectionalLight(0xfff0c0,1.4);sun.position.set(6,14,4);sun.target.position.set(0,0,-5.5);scene.add(sun,sun.target);
sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-12,right:12,top:12,bottom:-12,near:1,far:50});
const gr=new THREE.Mesh(new THREE.PlaneGeometry(200,200),dirtG);gr.rotation.x=-Math.PI/2;gr.position.y=-3;gr.receiveShadow=true;scene.add(gr);
const blk=(w,h,d,x,z)=>{const b=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),[dirtC,dirtC,grassM,dirtC,dirtC,dirtC]);b.position.set(x,-1.42,z);b.castShadow=b.receiveShadow=true;scene.add(b)};
blk(12,3,32,-9.6,-6);blk(12,3,32,9.6,-6);blk(7.2,3,1.7,0,.55);blk(7.2,3,1.7,0,-11.65);
for(let i=0;i<34;i++){const s=i%2?1:-1,x=s*rnd(11,15),z=rnd(8,-24),h=rnd(2,4),g=new THREE.Group();
 const tr=new THREE.Mesh(new THREE.CylinderGeometry(.15,.28,h,8),mat(0x5a3b1e));tr.position.y=h/2;g.add(tr);
 for(let k=0;k<2;k++){const cn=new THREE.Mesh(new THREE.IcosahedronGeometry(rnd(1,1.7),1),leafM);cn.position.set(rnd(-.4,.4),h+.5+k*.7,rnd(-.4,.4));g.add(cn)}
 g.traverse(o=>o.castShadow=true);g.position.set(x,0,z);scene.add(g)}
for(let i=0;i<24;i++){const r=new THREE.Mesh(new THREE.DodecahedronGeometry(rnd(.3,.9),0),mat(0x7b6f61,{roughness:1,flatShading:true}));r.scale.y=.7;r.position.set((i%2?1:-1)*rnd(11,15),.15,rnd(7,-23));r.castShadow=true;scene.add(r)}
// gradins + public
const stM=mat(0x6b5a48,{roughness:1}),pk=a=>a[Math.floor(Math.random()*a.length)],NS=208,
bodyI=new THREE.InstancedMesh(new THREE.CylinderGeometry(.16,.2,.5,10),mat(0xffffff),NS),headI=new THREE.InstancedMesh(new THREE.SphereGeometry(.14,12,10),mat(0xffffff),NS),
skin=[0xf1c9a5,0xd9a273,0x9c6b43,0x6b4426],shirt=[0xe53935,0x1e88e5,0xfdd835,0x43a047,0xffffff,0x8e24aa,0xfb8c00,0x00acc1],ph=[],bx=[];
let n=0,cheer=0;
for(const s of[-1,1])for(let i=0;i<4;i++){const h=.45*(i+1),b=new THREE.Mesh(new THREE.BoxGeometry(1,h,14.2),stM);b.position.set(s*(5.5+i),.08+h/2,-6);b.castShadow=b.receiveShadow=true;scene.add(b);
 for(let k=0;k<26;k++){bx.push({x:s*(5.5+i)+rnd(-.15,.15),y:.08+h,z:.6-k*.52});ph.push(rnd(0,6.28));bodyI.setColorAt(n,new THREE.Color(pk(shirt)));headI.setColorAt(n,new THREE.Color(pk(skin)));n++}}
bodyI.frustumCulled=headI.frustumCulled=false;bodyI.castShadow=headI.castShadow=true;scene.add(bodyI,headI);
const dm=new THREE.Object3D();
function crowd(now){if(over&&fell<0)cheer=Math.max(cheer,.8);cheer*=.985;
 for(let i=0;i<NS;i++){const b=bx[i],a=(.03+cheer*.28)*Math.abs(Math.sin(now/(260-Math.min(cheer,1.5)*80)+ph[i])),y=b.y+.25+a;
  dm.position.set(b.x,y,b.z);dm.updateMatrix();bodyI.setMatrixAt(i,dm.matrix);dm.position.y=y+.4;dm.updateMatrix();headI.setMatrixAt(i,dm.matrix)}
 bodyI.instanceMatrix.needsUpdate=headI.instanceMatrix.needsUpdate=true}
// planches
const woodT=tex(g=>{g.fillStyle='#1b1b1d';g.fillRect(0,0,256,256);for(let i=0;i<60;i++){g.strokeStyle=`rgba(255,255,255,${rnd(.03,.12)})`;g.lineWidth=rnd(1,3);const y=rnd(0,256);g.beginPath();g.moveTo(0,y);g.bezierCurveTo(80,y+rnd(-5,5),170,y+rnd(-5,5),256,y);g.stroke()}
 g.fillStyle='rgba(0,0,0,.7)';g.fillRect(0,0,6,256);g.fillRect(250,0,6,256);g.fillStyle='#9a9a9a';[[22,60],[22,196],[234,60],[234,196]].forEach(([x,y])=>{g.beginPath();g.arc(x,y,6,0,7);g.fill()})},1);
const pg=new THREE.BoxGeometry(1.05,.16,.92),sideM=mat(0x101012);
function spr(txt,sz,c){const cv=document.createElement('canvas');cv.width=cv.height=128;const g=cv.getContext('2d');g.font='bold 84px Georgia';g.textAlign='center';g.textBaseline='middle';g.fillStyle=c;g.fillText(txt,64,70);
 const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(cv),transparent:true,depthTest:false}));s.scale.set(sz,sz,1);s.renderOrder=5;return s}
const planks=[],slabs=[];
for(let r=0;r<=R;r++){const z=r?-r*DZ:.4;
 if(r){planks[r]=[];for(let c=0;c<C;c++){const m=new THREE.Mesh(pg,[sideM,sideM,mat(0xffffff,{map:woodT,roughness:.5}),sideM,sideM,sideM]);m.position.set((c-(C-1)/2)*DX,0,z);m.castShadow=m.receiveShadow=true;m.userData={r,c};scene.add(m);planks[r][c]=m}}
 const sl=new THREE.Mesh(new THREE.BoxGeometry(.85,.16,.62),mat(0x3b2a1a));sl.position.set(-4.1,.04,z);sl.receiveShadow=true;scene.add(sl);slabs[r]=sl;
 const t=spr(r===0?'🌱':r===R?'🏁':String(r),.55,'#f3e3c3');t.position.set(-4.1,.3,z);scene.add(t)}
const rope=mat(0x6d4c2a,{roughness:1});
[-1,1].forEach(s=>{const b=new THREE.Mesh(new THREE.CylinderGeometry(.05,.05,13.4,8),rope);b.rotation.x=Math.PI/2;b.position.set(s*3.2,.7,-5.8);scene.add(b);
 for(let i=0;i<=8;i++){const p=new THREE.Mesh(new THREE.CylinderGeometry(.08,.08,.7,8),rope);p.position.set(s*3.2,.35,.4-i*1.6);p.castShadow=true;scene.add(p)}});
const pole=new THREE.Mesh(new THREE.CylinderGeometry(.04,.04,2.2,8),rope);pole.position.set(0,1.1,-12.2);scene.add(pole);
const flag=new THREE.Mesh(new THREE.PlaneGeometry(.9,.55),mat(0xffc107,{side:THREE.DoubleSide}));flag.position.set(.45,1.8,-12.2);scene.add(flag);
// personnages
const sp=(r,c,sx,sy,sz,x,y,z)=>{const m=new THREE.Mesh(new THREE.SphereGeometry(r,20,14),mat(c));m.scale.set(sx,sy,sz);m.position.set(x,y,z);return m};
const cn=(r,h,c,x,y,z,rx,rz)=>{const m=new THREE.Mesh(new THREE.ConeGeometry(r,h,12),mat(c));m.position.set(x,y,z);m.rotation.set(rx||0,0,rz||0);return m};
const leg=(c,x)=>{const m=new THREE.Mesh(new THREE.CylinderGeometry(.06,.07,.16,10),mat(c));m.position.set(x,.08,-.02);return m};
function ring(col){const m=new THREE.Mesh(new THREE.TorusGeometry(.36,.04,8,32),new THREE.MeshBasicMaterial({color:col}));m.rotation.x=Math.PI/2;m.position.y=.03;return m}
function fox(O){const g=new THREE.Group(),W=0xfff3e0,K=0x2a1d16;
 g.add(sp(.3,O,1,1.1,1,0,.42,0),sp(.2,W,1,1,.6,0,.4,-.2),sp(.26,O,1.1,1,1,0,.9,-.02),cn(.12,.3,O,-.17,1.22,0,0,.25),cn(.12,.3,O,.17,1.22,0,0,-.25),
  cn(.1,.22,W,0,.84,-.3,-Math.PI/2),sp(.035,K,1,1,1,0,.85,-.42),sp(.035,K,1,1,1,-.1,.97,-.22),sp(.035,K,1,1,1,.1,.97,-.22),
  cn(.14,.5,O,0,.38,.42,Math.PI/2+.4),sp(.09,W,1,1,1,0,.5,.66),leg(K,-.12),leg(K,.12));return g}
function bear(B){const g=new THREE.Group(),L=0xe8eef7,K=0x201510;
 g.add(sp(.33,B,1,1.1,1,0,.42,0),sp(.22,L,1,1,.6,0,.4,-.2),sp(.28,B,1,1,1,0,.92,-.02),sp(.1,B,1,1,.6,-.2,1.18,0),sp(.1,B,1,1,.6,.2,1.18,0),
  sp(.12,L,1,.8,1,0,.86,-.24),sp(.04,K,1,.8,1,0,.9,-.35),sp(.035,K,1,1,1,-.1,.98,-.24),sp(.035,K,1,1,1,.1,.98,-.24),leg(B,-.13),leg(B,.13));return g}
function mk(body,col){const g=new THREE.Group(),b=body(col);b.add(ring(col));
 const ind=new THREE.Mesh(new THREE.ConeGeometry(.13,.28,4),new THREE.MeshBasicMaterial({color:col}));ind.rotation.x=Math.PI;b.add(ind);
 b.traverse(o=>o.castShadow=true);g.add(b);g.scale.setScalar(.85);g.userData.ind=ind;return g}
const P=[mk(fox,CH[0]),mk(bear,CH[1])];P.forEach(p=>scene.add(p));
// pollen
const N=160,fa=new Float32Array(N*3);for(let i=0;i<N;i++){fa[i*3]=rnd(-12,12);fa[i*3+1]=rnd(0,5);fa[i*3+2]=rnd(5,-16)}
const fg=new THREE.BufferGeometry();fg.setAttribute('position',new THREE.BufferAttribute(fa,3));
const ff=new THREE.Points(fg,new THREE.PointsMaterial({size:.1,color:0xfff3b0,transparent:true,opacity:.7,blending:THREE.AdditiveBlending,depthWrite:false}));scene.add(ff);
// animations
const A=[];const tw=(d,f,done)=>A.push({t:performance.now(),d,f,done});
function upd(now){for(let i=A.length-1;i>=0;i--){const a=A[i],k=Math.min(1,(now-a.t)/a.d);a.f(k);if(k===1){A.splice(i,1);a.done&&a.done()}}}
function hop(p,to,done){const f=p.position.clone();tw(450,k=>{p.position.lerpVectors(f,to,k);p.position.y+=Math.sin(k*Math.PI)*.7},done)}
const cel=w=>{const p=P[w],y=p.position.y;tw(1800,k=>{p.rotation.y=k*12.56;p.position.y=y+Math.abs(Math.sin(k*12))*.5})};
// jeu
let bad,pos,col,turn,over,busy,safe,fell,ft;const xs=[];
const spot=(r,c,p)=>new THREE.Vector3((c-(C-1)/2)*DX+(r>0?(p?.2:-.2):0),.08,r?-r*DZ:.4);
const goal=t=>new THREE.Vector3(t?.8:-.8,.08,-11.5);
const msg=t=>$('msg').textContent=t;
function hud(){[0,1].forEach(i=>{const e=$('c'+i);e.style.setProperty('--pc',CS[i]);e.classList.toggle('on',!over&&turn===i);
 e.innerHTML=`<span style="font-size:24px">${E[i]}</span><span><b style="color:${CS[i]}">Joueur ${i+1} · ${NM[i]}</b>${fell===i?'💥 Tombé':pos[i]===R?'🏁 Arrivé':'Ligne '+pos[i]+' / '+R}</span>`})}
function init(){bad=Array.from({length:R+1},()=>[...Array(C).keys()].sort(()=>Math.random()-.5).slice(0,2));pos=[0,0];col=[0,C-1];turn=0;over=busy=false;fell=-1;
 safe=Array.from({length:R+1},()=>Array(C).fill(0));ft=Array.from({length:R+1},()=>Array(C).fill(0));xs.forEach(s=>scene.remove(s));xs.length=0;
 for(let r=1;r<=R;r++)for(let c=0;c<C;c++){const m=planks[r][c];m.position.y=0;m.rotation.set(0,0,0);m.userData.brk=false}
 P.forEach((p,i)=>{p.visible=true;p.position.copy(spot(0,col[i],i));p.rotation.set(0,0,0)});msg('Joueur 1 (Rouge) 🦊 commence : 2 planches piégées par ligne, touche-en une de la ligne 1');hud()}
function step(r,c){if(busy||over||pos[turn]+1!==r)return;busy=true;const t=turn,p=P[t],m=planks[r][c];
 hop(p,spot(r,c,t),()=>{
  if(bad[r].includes(c)){pos[t]=r;col[t]=c;fell=t;m.userData.brk=true;cheer=1;msg(`💥 Crac ! Le Joueur ${t+1} (${NM[t]}) tombe…`);
   const x=spr('✕',.7,'#ff5252');x.position.set(m.position.x,.35,m.position.z);scene.add(x);xs.push(x);
   tw(450,k=>{m.rotation.z=-.3*k;m.rotation.x=.12*k;m.position.y=-.1*k});
   const y0=p.position.y;tw(900,k=>{p.position.y=y0-k*k*8;p.rotation.x=k*2},()=>{pos[t]=0;col[t]=t?C-1:0;fell=-1;m.rotation.set(0,0,0);m.position.y=0;m.userData.brk=false;xs.forEach(s=>scene.remove(s));xs.length=0;p.rotation.set(0,0,0);p.position.copy(spot(0,col[t],t));turn=1-t;busy=false;
    msg(`Au tour du Joueur ${turn+1} (${NM[turn]}) ${E[turn]} : retiens bien les planches piégées !`);hud()})
  }else{pos[t]=r;col[t]=c;safe[r][c]=t+1;ft[r][c]=performance.now();cheer=Math.max(cheer,.35);
   if(r===R){hud();hop(p,goal(t),()=>{over=true;busy=false;msg(`🏆 Le Joueur ${t+1} (${NM[t]}) ${E[t]} a traversé la forêt et gagne !`);hud();cel(t)});return}
   turn=1-t;busy=false;msg(`✅ Bien joué ! Au tour du Joueur ${turn+1} (${NM[turn]}) ${E[turn]}`);hud()}})}
const ray=new THREE.Raycaster(),mv=new THREE.Vector2();
ren.domElement.addEventListener('pointerdown',e=>{if(busy||over)return;mv.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);ray.setFromCamera(mv,cam);
 const h=ray.intersectObjects(planks[pos[turn]+1]);if(h.length)step(h[0].object.userData.r,h[0].object.userData.c)});
$('re').onclick=init;
function rs(){const a=innerWidth/innerHeight,t=Math.tan(22.5*Math.PI/180),d=Math.max(4.8/(t*a),7.6/t),tg=new THREE.Vector3(-.5,0,-5.6);
 cam.aspect=a;cam.position.set(tg.x,d*.86,tg.z+d*.5);cam.lookAt(tg);cam.updateProjectionMatrix();ren.setSize(innerWidth,innerHeight)}
addEventListener('resize',rs);rs();
function loop(now){requestAnimationFrame(loop);upd(now);
 const ar=!over&&!busy?pos[turn]+1:-1,s=Math.sin(now/250);
 for(let r=1;r<=R;r++)for(let c=0;c<C;c++){const m=planks[r][c],em=m.material[2].emissive;
  if(m.userData.brk)em.setHex(0x330000);else if(safe[r][c]&&now-ft[r][c]<900)em.setHex(CH[safe[r][c]-1]).multiplyScalar(.5*Math.max(0,1-(now-ft[r][c])/900));else if(r===ar)em.setRGB(.34+.14*s,.24+.1*s,0);else em.setHex(0)}
 slabs.forEach((sl,r)=>{const on=!over&&r===pos[turn];sl.material.color.setHex(on?0x4caf50:0x3b2a1a);sl.material.emissive.setHex(on?0x1b5e20:0)});
 P.forEach((p,i)=>{const d=p.userData.ind;d.visible=!over&&turn===i;d.position.y=1.5+Math.sin(now/300)*.08;d.rotation.y=now/400});
 crowd(now);flag.rotation.y=Math.sin(now/500)*.25;ff.position.y=Math.sin(now/1800)*.4;ren.render(scene,cam)}
init();requestAnimationFrame(loop);
</script>
</body>
</html>
