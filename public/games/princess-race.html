<html lang="fr"><head><meta charset="utf-8">

<title>La Course vers la Princesse</title>
<style>

.die{width:50px;height:50px;border-radius:10px;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:6px;box-sizing:border-box;box-shadow:0 6px 16px #000a,inset 0 -4px 6px #0003,inset 0 3px 4px #fff6}

.die.rolling{animation:tumble .25s linear infinite}

.dl{font-size:11px;text-align:center;margin-top:4px;color:var(--gold);letter-spacing:1px}
.pb{height:8px;background:#fff2;border-radius:4px;margin-top:6px;overflow:hidden}.pb div{height:100%;transition:width .4s}
.dw2{position:relative}
.die{cursor:default;opacity:.55;transition:opacity .2s}
.die.ready{opacity:1;cursor:pointer;animation:pulse 1.1s ease-in-out infinite}
.die.off{filter:grayscale(1);opacity:.35}
.die.rolling{opacity:1;animation:tumble .25s linear infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
#rc{position:absolute;top:-8px;right:-8px;background:#111;color:#fff;border:2px solid var(--gold);border-radius:50%;width:24px;height:24px;font:bold 13px Georgia;display:flex;align-items:center;justify-content:center}
#toast{position:fixed;left:0;right:0;top:20%;text-align:center;font:bold clamp(28px,7vw,52px) Georgia,serif;pointer-events:none;opacity:0;text-shadow:0 3px 10px #000,0 0 3px #000}
#toast.show{animation:tst 2.2s ease-out}
@keyframes tst{0%{opacity:0;transform:scale(.5)}15%{opacity:1;transform:scale(1.15)}30%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-30px)}}
#mm{position:fixed;left:50%;transform:translateX(-50%);top:84px;bottom:175px;width:62px;background:var(--panel);border:1px solid var(--gold);border-radius:10px;pointer-events:none}
#mm .t{position:absolute;top:26px;bottom:12px;width:12px;border-radius:6px;background:#fff2}
#mm .m{position:absolute;left:-4px;width:20px;height:20px;border-radius:50%;border:2px solid #fff;margin-bottom:-10px;transition:bottom .25s linear;font:bold 10px Georgia;display:flex;align-items:center;justify-content:center;color:#000}
#mm small{position:absolute;top:5px;left:0;right:0;text-align:center;font-size:11px;color:var(--gold)}
button{font:bold 16px Georgia,serif;padding:12px 16px;border-radius:10px;border:1px solid var(--gold);background:linear-gradient(#6b4a1e,#3d2a10);color:var(--fg);cursor:pointer}
button.r{background:linear-gradient(#b03a2e,#6e1f17)}
button:disabled{opacity:.4;cursor:not-allowed}
#end{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:16px;background:#000a;text-align:center;font-size:28px;padding:20px}
</style></head><body>

<div id="row"><div class="dw2"><div class="die" id="dw"></div></div><div class="dw2"><div class="die" id="dr"></div><span id="rc">3</span></div></div></div>
<div id="end"><div id="et"></div><button id="again">Rejouer</button></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

function knight(col){const k=new THREE.Group(),steel=mat(0x9aa3ad,.3,.9),cm=mat(col,.6);
box(new THREE.BoxGeometry(.25,.7,.25),steel,-.18,.35,0,k);box(new THREE.BoxGeometry(.25,.7,.25),steel,.18,.35,0,k);
box(new THREE.BoxGeometry(.8,.9,.45),steel,0,1.15,0,k);box(new THREE.BoxGeometry(.82,.3,.47),cm,0,.8,0,k);

box(new THREE.BoxGeometry(.1,.9,.5),cm,-.55,1.2,.15,k);

const K=[knight(0xd4a017),knight(0x2e6bd6)],knightLabels=[];K.forEach((k,i)=>{k.position.set(i?TX:-TX,0,2.6);k.rotation.y=i?-.2:.2;S.add(k);const l=label(i?"BOT":"VOUS",i?"#6fa8ff":"#ffd34d",2.4,.8,150,false);knightLabels[i]=l;l.position.y=3;k.add(l);
const x=i?TX:-TX,f=new THREE.Mesh(new THREE.PlaneGeometry(1.6,1),new THREE.MeshStandardMaterial({color:i?0x2e6bd6:0xd4a017,side:2}));f.position.set(x+.8,H+2.5,0);S.add(f);const p=new THREE.Mesh(new THREE.CylinderGeometry(.05,.05,3),mat(0x333333));p.position.set(x,H+1.5,0);S.add(p)});

box(new THREE.SphereGeometry(1.1,16,16),gm,0,.9,0,dragon).scale.set(1.5,1,1);
const neck=box(new THREE.CylinderGeometry(.3,.45,1.4),gm,1.4,1.7,0,dragon);neck.rotation.z=-.6;
box(new THREE.SphereGeometry(.5,16,16),gm,2,2.4,0,dragon).scale.set(1.4,.9,.9);
box(new THREE.SphereGeometry(.08),mat(0xff2200),2.3,2.6,.3,dragon);
const tail=box(new THREE.ConeGeometry(.5,2.5,10),gm,-2.2,.7,0,dragon);tail.rotation.z=Math.PI/2+.3;
const wings=[1,-1].map(s=>{const w=box(new THREE.BoxGeometry(.1,1.8,2.2),mat(0x1c5226,.8),-.2,1.8,s*1.4,dragon);return w});
dragon.position.set(-2.4,H+.2,-.3);dragon.scale.setScalar(.8);S.add(dragon);
const pr=new THREE.Group();box(new THREE.ConeGeometry(.6,1.5,16),mat(0xff7fb0),0,.75,0,pr);
box(new THREE.SphereGeometry(.25,16,16),mat(0xf2c9a5),0,1.7,0,pr);box(new THREE.ConeGeometry(.22,.3,5),mat(0xffd700,.3,.8),0,2.05,0,pr);

const st=new THREE.BufferGeometry(),sp=[];for(let i=0;i<500;i++)sp.push((Math.random()-.5)*200,30+Math.random()*60,-60-Math.random()*40);

const moon=new THREE.Mesh(new THREE.SphereGeometry(5,24,24),new THREE.MeshBasicMaterial({color:0xf4f1d8,fog:false}));moon.position.set(-35,45,-90);S.add(moon);
for(let i=0;i<30;i++){const t=new THREE.Mesh(new THREE.ConeGeometry(2+Math.random()*2,8+Math.random()*6,7),mat(0x143018,1));const a=Math.random()*6.28,d=45+Math.random()*30;t.position.set(Math.cos(a)*d*1.1,4,-Math.abs(Math.sin(a))*d-8);S.add(t)}
const G={pos:[0,0],red:[3,3],turn:0,busy:false,over:false},vy=[0,0];
let gameMode="solo",ownSlot=0,playerNames=["Vous","BOT"],lastOnlineAction=0,onlinePaused=false;
const $=id=>document.getElementById(id);
const log=t=>$("log").textContent=t;
const pb=(v,c)=>"<div class='pb'><div style='width:"+(v/N*100)+"%;background:"+c+"'></div></div>";
function escapeHtml(value){return String(value).replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]))}
function hud(){$("p0").innerHTML="<b>"+escapeHtml(playerNames[0])+"</b> (chevalier OR)<br>Échelon "+G.pos[0]+"/"+N+" · Dé rouge ×"+G.red[0]+pb(G.pos[0],"#e03030");$("p1").innerHTML="<b>"+escapeHtml(playerNames[1])+"</b> (chevalier BLEU)<br>Échelon "+G.pos[1]+"/"+N+" · Dé rouge ×"+G.red[1]+pb(G.pos[1],"#2ecc40");
$("p0").style.boxShadow=G.turn===0&&!G.over?"0 0 16px #e03030":"none";$("p1").style.boxShadow=G.turn===1&&!G.over?"0 0 16px #2ecc40":"none";
const can=!onlinePaused&&!G.busy&&!G.over&&(gameMode==="local"||G.turn===ownSlot);$("dw").classList.toggle("ready",can);$("dr").classList.toggle("ready",can&&G.red[G.turn]>0);$("dr").classList.toggle("off",G.red[G.turn]<1);$("rc").textContent=G.red[G.turn];
knightLabels.forEach((label,i)=>{const canvas=label.material.map.image,context=canvas.getContext("2d");context.clearRect(0,0,canvas.width,canvas.height);context.font="bold 150px Georgia";context.textAlign="center";context.textBaseline="middle";context.lineWidth=25;context.strokeStyle="#000";context.strokeText(playerNames[i],256,canvas.height/2);context.fillStyle=i?"#6fa8ff":"#ffd34d";context.fillText(playerNames[i],256,canvas.height/2);label.material.map.needsUpdate=true})}
function setDie(el,v){el.innerHTML="";const P=[[],[4],[0,8],[0,4,8],[0,2,6,8],[0,2,4,6,8],[0,2,3,5,6,8]][v||0];for(let i=0;i<9;i++){const d=document.createElement("i");if(P.includes(i))d.className="on";el.appendChild(d)}}

const who=p=>playerNames[p];
function act(p,type,fromBot=false){if(G.over||G.busy||onlinePaused||G.turn!==p||gameMode==="solo"&&p!==0&&!fromBot)return;

$("dw").onclick=()=>act(G.turn,"w");$("dr").onclick=()=>G.red[G.turn]>0&&act(G.turn,"r");

hud();
const pt=[0,0],FX=[],CM={y:6,d:30,x:0},V={ph:0,t:0,p:0,F:null,D:15,h:null};
function resetLocalGame(){resetV();G.pos=[0,0];G.red=[3,3];G.turn=0;G.busy=false;G.over=false;onlinePaused=false;lastOnlineAction=0;pt[0]=pt[1]=0;vy[0]=vy[1]=0;RG.forEach(rows=>rows.forEach(P=>{P.a.visible=P.b.visible=false;P.st=0;P.t=0;P.bd=0;P.a.position.set(P.hx-.4,P.hy,P.hz);P.b.position.set(P.hx+.4,P.hy,P.hz);P.a.rotation.set(0,0,0);P.b.rotation.set(0,0,0);P.mt.emissive.setHex(0);P.mt.emissiveIntensity=0;P.l.scale.set(P.lw,P.lh,1)}));DB.forEach(o=>S.remove(o.d));DB.length=0;FX.forEach(o=>S.remove(o.s));FX.length=0;$("end").style.display="none";setDie($("dw"),1);setDie($("dr"),1);hud();log(gameMode==="solo"?"Nouvelle partie ! À vous de jouer.":"Nouvelle partie ! Au tour du joueur OR.")}
function setMode(mode,slot=0,names){gameMode=mode;ownSlot=slot===1?1:0;playerNames=Array.isArray(names)?[String(names[0]||"Chevalier OR").slice(0,18),String(names[1]||"Chevalier BLEU").slice(0,18)]:mode==="solo"?["Vous","BOT"]:["Joueur OR","Joueur BLEU"];resetLocalGame();lastOnlineAction=0;hud()}
function applyOnlineState(state,slot,names){if(!state||!Array.isArray(state.positions)||!Array.isArray(state.redDice))return;ownSlot=slot===1?1:0;if(Array.isArray(names))playerNames=names.map((name,i)=>String(name||`Joueur ${i+1}`).slice(0,18));const action=state.lastAction;if(!action||action.id<=lastOnlineAction){if(!G.busy){G.pos=state.positions.slice();G.red=state.redDice.slice();G.turn=state.turn;G.over=state.winner!==null;hud()}return}lastOnlineAction=action.id;const el=action.die==="red"?$("dr"):$("dw");rollTo(el,action.result,()=>{G.pos=state.positions.slice();G.red=state.redDice.slice();G.turn=state.turn;G.over=state.winner!==null;G.busy=onlinePaused;if(state.winner!==null)winVisual(state.winner);else log(who(action.slot)+" a lancé "+(action.die==="red"?"le dé rouge":"le dé blanc")+" : "+action.result+". Au tour de "+who(state.turn)+".");hud()})}
