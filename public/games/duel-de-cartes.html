<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Duel de cartes 3D</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#0b0f0d;--fg:#f4efe2;--gold:#e8c66a;--panel:rgba(0,0,0,.5);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0b0f0d;--fg:#f4efe2;--gold:#e8c66a;--panel:rgba(0,0,0,.5)}}
:root[data-theme="dark"]{--bg:#0b0f0d;--fg:#f4efe2;--gold:#e8c66a;--panel:rgba(0,0,0,.5)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:Georgia,"Times New Roman",serif;overflow:hidden}
#c{display:block;width:100%;height:100%;touch-action:manipulation}
#hud{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:0;right:0;display:flex;justify-content:center;gap:12px;pointer-events:none}
.sc{background:var(--panel);border:1px solid rgba(232,198,106,.3);border-radius:14px;padding:8px 18px;text-align:center;min-width:104px;transition:box-shadow .3s,border-color .3s}
.sc.on{border-color:var(--gold);box-shadow:0 0 16px rgba(232,198,106,.55)}
.sc b{display:block;font-size:30px;line-height:1.1;color:var(--gold)}
.sc span{font-size:13px;opacity:.85}
#count{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-size:26vmin;color:var(--gold);text-shadow:0 6px 30px rgba(0,0,0,.8);pointer-events:none}
#ui{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);display:flex;flex-direction:column;align-items:center;gap:10px;padding:0 16px;pointer-events:none}
#msg{background:var(--panel);padding:8px 16px;border-radius:12px;text-align:center;font-size:17px;max-width:90vw}
button{pointer-events:auto;font:inherit;font-size:18px;color:#1a1205;background:var(--gold);border:0;border-radius:12px;padding:12px 26px;cursor:pointer}
button:focus-visible{outline:3px solid var(--fg);outline-offset:3px}
button:disabled{opacity:.45;cursor:default}
#end{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:rgba(0,0,0,.72);text-align:center;padding:20px}
#end h1{margin:0;font-size:clamp(28px,7vw,52px);color:var(--gold)}
#end p{margin:0;font-size:20px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div class="sc on" id="b0"><span>Joueur 1</span><b><i id="s0" style="font-style:normal">0</i>/5</b></div>
  <div class="sc" id="b1"><span>Joueur 2</span><b><i id="s1" style="font-style:normal">0</i>/5</b></div>
</div>
<div id="count"></div>
<div id="ui"><div id="msg"></div><button id="draw">Distribuer les cartes</button></div>
<div id="end"><h1 id="eh"></h1><p id="ep"></p><button id="again">Rejouer</button></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const W=1.4,H=2,R=.13,T=.02,SX=1.6,SZ=0,TY=.222,GOAL=10;
const renderer=new THREE.WebGLRenderer({canvas:$('c'),antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();scene.background=new THREE.Color(0x0b0f0d);
const cam=new THREE.PerspectiveCamera(45,1,.1,100);
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix();const d=Math.max(15,13/cam.aspect);cam.position.set(0,d*.74,d*.68);cam.lookAt(0,0,.3)}
addEventListener('resize',resize);resize();

/* Lumières */
scene.add(new THREE.HemisphereLight(0xffffff,0x223322,.6));
const sp=new THREE.SpotLight(0xfff1d6,1.05,45,.9,.55,1);sp.position.set(0,14,4);sp.castShadow=true;sp.shadow.mapSize.set(2048,2048);sp.shadow.bias=-.0005;scene.add(sp);
const glow=new THREE.PointLight(0xffd36a,0,6,2);scene.add(glow);

/* Table */
const wood=new THREE.Mesh(new THREE.BoxGeometry(16.8,.4,10.8),new THREE.MeshStandardMaterial({color:0x4a2a14,roughness:.55}));
wood.receiveShadow=true;scene.add(wood);
const fc=document.createElement('canvas');fc.width=1280;fc.height=800;const g=fc.getContext('2d');
g.fillStyle='#1b5e3b';g.fillRect(0,0,1280,800);
for(let i=0;i<80000;i++){g.fillStyle=Math.random()<.5?'rgba(255,255,255,.04)':'rgba(0,0,0,.06)';g.fillRect(Math.random()*1280,Math.random()*800,2,2)}
const vg=g.createRadialGradient(640,400,200,640,400,760);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.4)');g.fillStyle=vg;g.fillRect(0,0,1280,800);
function rr(x,a,b,w,h,r){x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath()}
g.strokeStyle='rgba(232,198,106,.5)';g.lineWidth=3;g.fillStyle='rgba(232,198,106,.7)';g.font='28px Georgia,serif';g.textAlign='center';
[-SX,SX].forEach((sx,i)=>{const cx=640+sx*80,cy=400+SZ*80;rr(g,cx-66,cy-92,132,184,12);g.stroke();g.fillText('Joueur '+(i+1),cx,cy+130)});
rr(g,640-66,400-92,132,184,12);g.stroke();
const ft=new THREE.CanvasTexture(fc);ft.encoding=THREE.sRGBEncoding;ft.anisotropy=8;
const felt=new THREE.Mesh(new THREE.PlaneGeometry(16,10),new THREE.MeshStandardMaterial({map:ft,roughness:1}));
felt.rotation.x=-Math.PI/2;felt.position.y=.201;felt.receiveShadow=true;scene.add(felt);

/* Cartes */
function tex(c){const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;t.anisotropy=8;return t}
function faceTex(n){const c=document.createElement('canvas');c.width=280;c.height=400;const x=c.getContext('2d');
  const h=220-n*10,col=`hsl(${h},62%,36%)`;
  rr(x,0,0,280,400,28);x.fillStyle='#fbf8ef';x.fill();
  rr(x,14,14,252,372,18);x.strokeStyle=col;x.lineWidth=4;x.stroke();
  x.beginPath();x.arc(140,200,98,0,7);x.fillStyle=`hsla(${h},62%,36%,.12)`;x.fill();
  x.fillStyle=col;x.textAlign='center';x.textBaseline='middle';
  x.font='bold 170px Georgia,serif';x.fillText(n,140,208);
  x.font='bold 44px Georgia,serif';x.fillText(n,46,58);
  x.save();x.translate(234,342);x.rotate(Math.PI);x.fillText(n,0,0);x.restore();
  return tex(c)}
const bc=document.createElement('canvas');bc.width=280;bc.height=400;(()=>{const x=bc.getContext('2d');
  rr(x,0,0,280,400,28);x.fillStyle='#fbf8ef';x.fill();
  rr(x,16,16,248,368,16);x.fillStyle='#7a1626';x.fill();
  x.save();rr(x,16,16,248,368,16);x.clip();x.strokeStyle='rgba(255,255,255,.16)';x.lineWidth=2;
  for(let i=-400;i<700;i+=22){x.beginPath();x.moveTo(i,0);x.lineTo(i+400,400);x.moveTo(i+400,0);x.lineTo(i,400);x.stroke()}
  x.restore();
  rr(x,28,28,224,344,10);x.strokeStyle='#e8c66a';x.lineWidth=3;x.stroke();
  x.beginPath();x.arc(140,200,52,0,7);x.fillStyle='#7a1626';x.fill();x.stroke();
  x.beginPath();x.arc(140,200,34,0,7);x.stroke()})();
const backMat=new THREE.MeshStandardMaterial({map:tex(bc),roughness:.45});
const edgeMat=new THREE.MeshStandardMaterial({color:0xf3efe2,roughness:.7});
function rshape(w,h,r){const s=new THREE.Shape(),x=-w/2,y=-h/2;s.moveTo(x+r,y);s.lineTo(x+w-r,y);s.quadraticCurveTo(x+w,y,x+w,y+r);s.lineTo(x+w,y+h-r);s.quadraticCurveTo(x+w,y+h,x+w-r,y+h);s.lineTo(x+r,y+h);s.quadraticCurveTo(x,y+h,x,y+h-r);s.lineTo(x,y+r);s.quadraticCurveTo(x,y,x+r,y);return s}
const shp=rshape(W,H,R),planeG=new THREE.ShapeGeometry(shp,6);
{const uv=planeG.attributes.uv,p=planeG.attributes.position;for(let i=0;i<uv.count;i++)uv.setXY(i,p.getX(i)/W+.5,p.getY(i)/H+.5)}
const bodyG=new THREE.ExtrudeGeometry(shp,{depth:T,bevelEnabled:false,curveSegments:6});bodyG.translate(0,0,-T/2);
function makeCard(n){const pv=new THREE.Group(),fl=new THREE.Group();pv.add(fl);pv.rotation.x=-Math.PI/2;
  const body=new THREE.Mesh(bodyG,edgeMat);body.castShadow=true;
  const f=new THREE.Mesh(planeG,new THREE.MeshStandardMaterial({map:faceTex(n),roughness:.5}));f.position.z=T/2+.001;
  const b=new THREE.Mesh(planeG,backMat);b.rotation.y=Math.PI;b.position.z=-T/2-.001;
  fl.add(body,f,b);fl.rotation.y=Math.PI;pv.userData={n,fl,f};return pv}

/* Pioche */
const sideM=new THREE.MeshStandardMaterial({color:0xe9e3d2,roughness:.8});
const deckM=new THREE.Mesh(new THREE.BoxGeometry(W,1,H),[sideM,sideM,backMat,sideM,sideM,sideM]);
deckM.castShadow=true;deckM.receiveShadow=true;scene.add(deckM);

/* Outils */
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const tw=(ms,fn)=>new Promise(res=>{const s=performance.now();(function f(now){const t=Math.min(1,(now-s)/ms);fn(t);t<1?requestAnimationFrame(f):res()})(s)});
const wait=ms=>new Promise(r=>setTimeout(r,ms));
let ac;function audio(){ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume()}
function beep(f,d,v=.08,type='sine',delay=0){if(!ac)return;const t0=ac.currentTime+delay,o=ac.createOscillator(),gn=ac.createGain();o.type=type;o.frequency.value=f;gn.gain.setValueAtTime(v,t0);gn.gain.exponentialRampToValueAtTime(.0001,t0+d);o.connect(gn).connect(ac.destination);o.start(t0);o.stop(t0+d)}
const msg=t=>$('msg').textContent=t;

/* Jeu */
const NH=10,HS=.86,HZ=[3.7,-3.5],ROUNDS=10,WIN=5;
let deck=[],hands=[[],[]],played=[null,null],score=[0,0],turn=0,busy=true,round=0,hov=null;
const handPos=(p,i)=>new THREE.Vector3((i-(NH-1)/2)*HS,TY+i*.025,HZ[p]);
function updDeck(n){const t=Math.max(.02,n*.012);deckM.scale.y=t;deckM.position.y=.2+t/2;deckM.visible=n>0}
function shuffle(){deck=[...Array(20)].map((_,i)=>i+1);for(let i=19;i>0;i--){const j=Math.random()*(i+1)|0;[deck[i],deck[j]]=[deck[j],deck[i]]}updDeck(20)}
function hud(){$('s0').textContent=score[0];$('s1').textContent=score[1];$('b0').classList.toggle('on',turn===0);$('b1').classList.toggle('on',turn===1)}
function flipTo(c,ang){const f=c.userData.fl,a=f.rotation.y,y0=c.position.y;if(a===ang)return Promise.resolve();return tw(500,t=>{f.rotation.y=a+(ang-a)*ease(t);c.position.y=y0+Math.sin(Math.PI*t)*1.1})}
const showHands=()=>Promise.all([0,1].flatMap(p=>hands[p].map((c,i)=>wait(i*40).then(()=>flipTo(c,turn===p?0:Math.PI)))));
const layout=p=>Promise.all(hands[p].map((c,i)=>{const s=c.position.clone(),to=handPos(p,i);return tw(350,t=>c.position.lerpVectors(s,to,ease(t)))}));
async function deal(){
  if(!busy||hands[0].length)return;audio();$('draw').style.display='none';msg('Distribution des cartes…');
  const jobs=[];
  for(let k=0;k<NH*2;k++){const p=k%2,i=k>>1,n=deck.pop();
    jobs.push(wait(k*110).then(()=>{const c=makeCard(n);c.position.set(0,.2+deckM.scale.y+.015,0);scene.add(c);hands[p][i]=c;updDeck(19-k);beep(300+k*8,.06,.04,'triangle');
      const from=c.position.clone(),to=handPos(p,i);return tw(550,t=>{const e=ease(t);c.position.lerpVectors(from,to,e);c.position.y+=Math.sin(Math.PI*t)*1.2})}))}
  await Promise.all(jobs);turn=0;await startTurn();
}
async function startTurn(){hud();msg(`Manche ${round+1}. Joueur ${turn+1}, lance une carte`);await showHands();busy=false}
async function play(c){
  if(busy)return;busy=true;audio();hov=null;const p=turn;hands[p]=hands[p].filter(x=>x!==c);played[p]=c;
  const fl=c.userData.fl,from=c.position.clone(),to=new THREE.Vector3(p?SX:-SX,TY,SZ),rz=(Math.random()-.5)*.5,f0=fl.position.z,r0=fl.rotation.y;
  beep(260,.12,.06,'triangle');
  await tw(600,t=>{const e=ease(t);c.position.lerpVectors(from,to,e);c.position.y+=Math.sin(Math.PI*t)*2.2;c.rotation.z=rz*e;fl.position.z=f0*(1-e);fl.rotation.y=r0+(Math.PI-r0)*e});
  beep(150,.09,.08,'triangle');
  await Promise.all([tw(160,t=>{c.position.y=TY+.12*Math.sin(Math.PI*t)}),layout(p)]);
  if(p===0){turn=1;await startTurn()}else{turn=-1;hud();await showHands();await reveal()}
}
async function reveal(){
  msg('Cartes cachées, révélation dans…');
  for(let i=3;i>0;i--){$('count').textContent=i;beep(520,.15,.08);await wait(1000)}
  $('count').textContent='';
  await Promise.all(played.map(c=>tw(900,t=>{const e=ease(t);c.userData.fl.rotation.y=Math.PI*(1-e);c.position.y=TY+Math.sin(Math.PI*t)*1.1})));
  beep(380,.1,.06,'triangle');
  const na=played[0].userData.n,nb=played[1].userData.n,w=na>nb?0:1,wc=played[w];
  score[w]++;hud();
  glow.position.set(wc.position.x,1.6,wc.position.z);beep(660,.4,.08,'sine',.05);beep(880,.5,.08,'sine',.2);
  msg(`Joueur ${w+1} gagne la manche : ${Math.max(na,nb)} contre ${Math.min(na,nb)}`);
  await tw(700,t=>{const s=1+.14*Math.sin(Math.PI*t);wc.scale.set(s,s,s);glow.intensity=1.6*Math.sin(Math.PI*t)});
  glow.intensity=0;await wait(1500);
  await Promise.all(played.map(c=>{const s=c.position.clone();return tw(600,t=>{const e=ease(t);c.position.set(s.x+(9-s.x)*e,s.y+e*.5,s.z)})}));
  played.forEach(c=>{scene.remove(c);c.userData.f.material.map.dispose();c.userData.f.material.dispose()});played=[null,null];
  round++;
  if(score[w]>=WIN||round>=ROUNDS){finish();return}
  turn=0;await startTurn();
}
function finish(){
  turn=-1;hud();msg('Partie terminée');
  [0,1,2].forEach(i=>beep(523*[1,1.25,1.5][i],.6,.08,'sine',i*.2));
  $('eh').textContent=score[0]===score[1]?'Égalité parfaite !':`Joueur ${score[0]>score[1]?1:2} remporte la partie !`;
  $('ep').textContent=`Score final : ${score[0]} – ${score[1]}`;$('end').style.display='flex';
}
function reset(){
  [...hands[0],...hands[1],...played].forEach(c=>{if(c){scene.remove(c);c.userData.f.material.map.dispose()}});
  hands=[[],[]];played=[null,null];score=[0,0];round=0;turn=0;busy=true;shuffle();hud();
  $('end').style.display='none';$('draw').style.display='';$('draw').textContent='Distribuer les cartes';msg('Dix cartes chacun. Prêts ?');
}

/* Entrées */
const ray=new THREE.Raycaster(),mv=new THREE.Vector2();
function pick(e){if(busy)return null;mv.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);ray.setFromCamera(mv,cam);
  const h=ray.intersectObjects(hands[turn]||[],true)[0];if(!h)return null;let o=h.object;while(o&&!o.userData.fl)o=o.parent;return o}
$('c').addEventListener('pointermove',e=>{hov=pick(e)});
$('c').addEventListener('pointerdown',e=>{const c=pick(e);if(c)play(c)});
$('draw').addEventListener('click',deal);
addEventListener('keydown',e=>{if(e.code==='Space'&&$('draw').style.display!=='none'){e.preventDefault();deal()}});
$('again').addEventListener('click',reset);

reset();
(function loop(){for(const p of [0,1])for(const c of hands[p]){const f=c.userData.fl,t=(p===turn&&!busy&&c===hov)?.5:0;f.position.z+=(t-f.position.z)*.25}renderer.render(scene,cam);requestAnimationFrame(loop)})();
</script>
</body>
</html>
