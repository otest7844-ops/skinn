  $('oi').textContent='20 obstacles touchés · Score : '+Math.floor(score)+(nb?' 🏆 Nouveau record !':'')+' · Record : '+Math.floor(D.best)+' · +'+nc+' 🪙'+(arenaOnline?' · En attente du résultat de la manche…':'');
  if(arenaOnline){$('again').style.display='none';$('home').style.display='none'}
  sh('over','flex');
}
function kill(o){S.remove(o.m);obs.splice(obs.indexOf(o),1)}
function crash(o){
  if(inv>0||jetT>0)return false;
  if(bT>0){bT=0;inv=1.5;shake=.4;burst(P.position,12,pf,6);sfx('shield');kill(o);return false}
  hits=Math.min(20,hits+1);hitNotice=1.6;inv=1.5;shake=.4;sfx('hit');kill(o);
  if(hits>=20){die();return true}
  return false;
}
function board(){if(st==='run'&&bT<=0&&boards>0&&jetT<=0){boards--;bT=10;sfx('board')}}
function jump(){if(st==='run'&&py<=gY+.02){vy=shoeT>0?15:10.5;slide=0;sfx('jump')}else if(st==='run')jb=.15}
function down(){if(st!=='run')return;slide=.7;if(py>gY+.02)vy=-14;sfx('slide')}
function mv(d){if(st==='run'){const next=Math.max(0,Math.min(2,lane+d));if(next!==lane){lane=next;sfx('move')}}}
let gY=0,jb=0,cx=0,cy=4.2;
addEventListener('keydown',e=>{const k=e.key.toLowerCase();
  if(k==='arrowleft'||k==='q'||k==='a')mv(-1);else if(k==='arrowright'||k==='d')mv(1);
  else if(k==='arrowup'||k==='z'||k==='w')jump();else if(k==='arrowdown'||k==='s')down();else if(k===' '){e.preventDefault();board()}});
let sx=0,sy=0,lt=0,fired=0;
addEventListener('touchstart',e=>{if(e.target.closest('button'))return;sx=e.touches[0].clientX;sy=e.touches[0].clientY;fired=0},{passive:true});addEventListener('touchmove',e=>{if(fired||e.target.closest('button'))return;const t=e.touches[0],dx=t.clientX-sx,dy=t.clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))<22)return;fired=1;if(Math.abs(dx)>Math.abs(dy))mv(dx>0?1:-1);else dy<0?jump():down()},{passive:true});
addEventListener('touchend',e=>{if(e.target.closest('button'))return;const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;
  if(fired)return;if(Math.max(Math.abs(dx),Math.abs(dy))<24){const n=Date.now();if(n-lt<320)board();lt=n;return}
  if(Math.abs(dx)>Math.abs(dy))mv(dx>0?1:-1);else dy<0?jump():down()},{passive:true});
$('play').onclick=reset;$('again').onclick=reset;$('hb').onclick=board;
$('home').onclick=()=>{sh('over','none');sh('menu','flex');st='menu';ui()};
let shopK=0;
function shop(k){shopK=k;sh('menu','none');sh('shop','flex');const L=k?BD:CH,own=k?D.ob:D.oc,sel=k?D.b:D.c;
  $('st').textContent=k?'Hoverboards':'Balles';$('sco').textContent='🪙 '+D.coins;$('sg').innerHTML='';
  L.forEach((it,i)=>{const d=document.createElement('div');d.className='c';const o=own.includes(i);
    d.innerHTML='<div class="sw" style="background:#'+(k?it.c:it.h).toString(16).padStart(6,'0')+'"></div><b>'+it.n+'</b>';
    const b=document.createElement('button');b.textContent=sel===i?'Équipé':o?'Choisir':'🪙 '+it.p;b.disabled=sel===i||(!o&&D.coins<it.p);
    b.onclick=()=>{if(!o){D.coins-=it.p;own.push(i)}if(k)D.b=i;else D.c=i;sv();skin();shop(k)};d.appendChild(b);$('sg').appendChild(d)})}
$('b1').onclick=()=>shop(0);$('b2').onclick=()=>shop(1);$('sb').onclick=()=>{sh('shop','none');sh('menu','flex');ui()};
const arenaOpponentHud=document.createElement('div');arenaOpponentHud.id='arena-opponent';arenaOpponentHud.style.cssText='position:fixed;top:calc(env(safe-area-inset-top,0px) + 72px);right:16px;z-index:5;padding:7px 10px;border:1px solid #ffffff66;border-radius:12px;background:#10152dcc;color:#fff;font:700 13px system-ui;text-shadow:0 2px 3px #000;pointer-events:none;display:none';document.body.appendChild(arenaOpponentHud);
function arenaPublish(){
  if(!arenaOnline||arenaPaused||!['run','over'].includes(st)||performance.now()-arenaLastPublish<75)return;
  arenaLastPublish=performance.now();
  parent.postMessage({type:'ball-rush:state',state:{x:px,y:py,lane,score:Math.floor(score),coins:nc,hits,alive:st==='run'}},location.origin);
}
function arenaApply(snapshot){
  if(!arenaOnline||!snapshot||!Array.isArray(snapshot.players))return;
  const next=snapshot.players[1-arenaSlot]||null;
  if(next){
    const now=performance.now();
    const progress=Math.min(1,(now-arenaRemoteAt)/90);
    arenaRemoteFrom=arenaRemotePlayer?{
      lane:arenaRemoteFrom.lane+(arenaRemotePlayer.lane-arenaRemoteFrom.lane)*progress,
      y:arenaRemoteFrom.y+(arenaRemotePlayer.y-arenaRemoteFrom.y)*progress,
    }:{lane:next.lane,y:next.y};
    arenaRemoteAt=now;
  }
  arenaRemotePlayer=next;
  if(arenaRemotePlayer){
    arenaOpponentHud.style.display='block';
    const name=arenaNames[1-arenaSlot]||`Joueur ${2-arenaSlot}`;
    const remainingLives=Math.max(0,20-(arenaRemotePlayer.hits||0));
    arenaOpponentHud.textContent=`${name} · ${Math.floor(arenaRemotePlayer.score||0)} pts · ${remainingLives}/20 vies · ${arenaRemotePlayer.alive?'EN COURSE':'ÉLIMINÉ'}`;
  }
}
window.addEventListener('message',event=>{
  if(event.source!==parent||event.origin!==location.origin||!event.data)return;
  if(event.data.type==='ball-rush:enable'&&[0,1].includes(event.data.slot)){
    arenaOnline=true;arenaPaused=false;arenaSlot=event.data.slot;arenaNames=Array.isArray(event.data.names)?event.data.names:arenaNames;
    setArenaSeed(event.data.seed);arenaRemotePlayer=null;arenaRemoteFrom=null;arenaRemoteAt=0;arenaLastPublish=0;arenaOpponentHud.style.display='none';reset();
    parent.postMessage({type:'ball-rush:ready'},location.origin);
  }else if(event.data.type==='ball-rush:pause')arenaPaused=true;
  else if(event.data.type==='ball-rush:resume')arenaPaused=false;
  else if(event.data.type==='ball-rush:state')arenaApply(event.data.state);
});
let last=performance.now();
function loop(now){
  requestAnimationFrame(loop);
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(arenaPaused){R.render(S,C);return}
  const run=st==='run',sp=run?speed:st==='menu'?5:0,dz=sp*dt;
  tiles.forEach(t=>{t.position.z+=dz;if(t.position.z>TL*1.5){t.position.z-=TL*NT;}});
  if(run){
    tm+=dt;speed=22.5+Math.min(24,tm*.42);dist+=dz;acc+=dz;
    const mul=(x2T>0?2:1);score+=dz*mul;
    if(acc>gap){acc=0;gap=Math.max(9,16-tm*.04)+arenaTrackRandom()*7;spawn()}
    px+=(LANES[lane]-px)*Math.min(1,dt*18);
    magT=Math.max(0,magT-dt);shoeT=Math.max(0,shoeT-dt);x2T=Math.max(0,x2T-dt);bT=Math.max(0,bT-dt);hitNotice=Math.max(0,hitNotice-dt);
    if(inv>0)inv-=dt;if(slide>0)slide-=dt;
    if(jetT>0){jetT-=dt;if(jetT<=0)inv=1.5}
    // ground height
    gY=0;for(const o of obs){if(Math.abs(px-o.x)>.9)continue;const z=o.m.position.z;
      if(o.type==='train'&&Math.abs(z)<o.hd&&py>=2.45)gY=Math.max(gY,2.8);
      else if(o.type==='ramp'&&Math.abs(z)<3)gY=Math.max(gY,2.8*Math.min(1,Math.max(0,(z+3)/6)))}
    if(jetT>0){py+=(5.4-py)*Math.min(1,dt*4);vy=0;burst(new THREE.Vector3(px,py+.6,.5),1,pf,2)}
    else{vy-=30*dt;py+=vy*dt;if(py<gY){py=gY;vy=0}}
    const ph=1.2;if(jb>0){jb-=dt;if(py<=gY+.02){jump();jb=0}}
    for(let i=obs.length-1;i>=0;i--){const o=obs[i];o.m.position.z+=dz+o.v*dt;
      if(o.m.position.z>14){S.remove(o.m);obs.splice(i,1);continue}
      if(o.type==='ramp')continue;
      if(Math.abs(px-o.x)<.9&&Math.abs(o.m.position.z)<o.hd+.25&&py<o.y1&&py+ph>o.y0){if(crash(o))break}}
    for(let i=items.length-1;i>=0;i--){const c=items[i],k=c.userData.k;c.position.z+=dz;c.rotation[k==='coin'?'z':'y']+=dt*5;
      if(k==='coin'&&magT>0&&Math.abs(c.position.z)<9){const f=Math.min(1,dt*8);c.position.x+=(px-c.position.x)*f;c.position.y+=(py+1-c.position.y)*f;c.position.z-=c.position.z*f*.5}
      if(c.position.z>12){S.remove(c);items.splice(i,1);continue}
      if(Math.abs(c.position.x-px)<.8&&Math.abs(c.position.z)<.9&&py<c.position.y+.5&&py+ph>c.position.y-.5){
        if(k==='coin'){nc++;burst(c.position,6,pm,4);sfx('coin')}else if(k==='mag'){magT=8;sfx('power')}else if(k==='jet'){jetT=5;slide=0;sfx('power')}else if(k==='shoe'){shoeT=10;sfx('power')}else{x2T=15;sfx('power')}
        S.remove(c);items.splice(i,1)}}
    const a=tm*speed*.6;ballM.rotation.x-=dz/.6;burst(new THREE.Vector3(px,py+.2,.9),1,pm,1.2);
    lL.rotation.x=Math.sin(a)*.9;lR.rotation.x=-Math.sin(a)*.9;aL.rotation.x=-Math.sin(a)*.8;aR.rotation.x=Math.sin(a)*.8;
    const air=py>gY+.05&&jetT<=0;if(air){lL.rotation.x=-.6;lR.rotation.x=.5}
    body.rotation.x=slide>0?-.9:0;body.position.y=slide>0?-.45:0;P.rotation.z=(px-LANES[lane])*.12;
    P.position.y=py;P.visible=inv<=0||Math.floor(now/80)%2===0;
    hbd.visible=bT>0;bub.visible=bT>0;jp.visible=jetT>0;
    if(bT>0){lL.rotation.x=lR.rotation.x=0}
    $('sc').textContent=Math.floor(score);$('mu').textContent=x2T>0?'×2':'';$('co').textContent='🪙 '+nc;$('hb').textContent='🛹 ×'+boards;
    $('life').textContent=`❤️ ${20-hits}/20${hitNotice>0?' · Impact !':''}`;
    $('pw').textContent=(magT>0?'🧲'+Math.ceil(magT)+'s ':'')+(jetT>0?'🚀'+Math.ceil(jetT)+'s ':'')+(shoeT>0?'👟'+Math.ceil(shoeT)+'s ':'')+(bT>0?'🛹'+Math.ceil(bT)+'s ':'')+(hitNotice>0?`💥 Obstacle ${hits}/20 · ${20-hits} vies restantes`:'');
    // chaser
    const cT=10;copD+=(cT-copD)*Math.min(1,dt*2);
    cop.position.set(px*.9,py*0,copD);dog.position.set(px*.9+.9,0,copD+.8);
    cL.rotation.x=Math.sin(a)*.9;cR.rotation.x=-Math.sin(a)*.9;dl.forEach((l,i)=>l.rotation.x=Math.sin(a*1.5+i*1.6)*.8);dog.position.y=Math.abs(Math.sin(a*1.5))*.15;
    cop.visible=dog.visible=false;
  }else if(st==='menu'){P.rotation.y=Math.PI*.9+Math.sin(now/900)*.3;P.position.set(0,0,0);body.position.y=0;lL.rotation.x=lR.rotation.x=aL.rotation.x=aR.rotation.x=0;cop.visible=dog.visible=false;px=0;hbd.visible=bub.visible=jp.visible=false;P.visible=true;P.rotation.z=0;body.rotation.x=0}
  for(let i=parts.length-1;i>=0;i--){const p=parts[i],u=p.userData;u.t-=dt;p.position.addScaledVector(u.v,dt);u.v.y-=9*dt;p.scale.setScalar(Math.max(.01,u.t*2));if(u.t<=0){S.remove(p);parts.splice(i,1)}}
  if(run)P.position.x=px;if(shake>0)shake-=dt;
  if(arenaOnline&&arenaRemotePlayer){
    arenaRemoteModel.visible=true;
    const progress=Math.min(1,(now-arenaRemoteAt)/90);
    const lane=arenaRemoteFrom?arenaRemoteFrom.lane+(arenaRemotePlayer.lane-arenaRemoteFrom.lane)*progress:arenaRemotePlayer.lane;
    const y=arenaRemoteFrom?arenaRemoteFrom.y+(arenaRemotePlayer.y-arenaRemoteFrom.y)*progress:arenaRemotePlayer.y;
    const laneX=LANES[0]+(LANES[2]-LANES[0])*(Math.max(0,Math.min(2,lane))/2);
    arenaRemoteModel.position.set(laneX,Math.max(0,y||0),-2.2);
    arenaRemoteModel.rotation.y=Math.PI;
  }
  arenaPublish();
  const q=shake>0?shake*.6:0;
  if(st==='menu'){C.position.set(0,2,5.5);C.lookAt(0,1.2,0)}
  else{cx+=(px*.6-cx)*Math.min(1,dt*6);cy+=(4.2+py*.5-cy)*Math.min(1,dt*5);C.position.set(cx+(Math.random()-.5)*q,cy+(Math.random()-.5)*q,7);C.lookAt(cx*.6,1.4+py*.3,-8)}
  const tf=run?62+(speed-15)*.5:62;C.fov+=(tf-C.fov)*.05;C.updateProjectionMatrix();
  sun.position.set(px+6,14,6);sun.target.position.set(px,0,0);
  R.render(S,C);
}
requestAnimationFrame(loop);
})();
