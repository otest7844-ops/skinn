<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Ping Pong</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <style>
    :root { box-sizing: border-box; --s: 1; }
    html, body { margin: 0; height: 100%; background: #d9d9d9; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; font-family: Georgia, "Times New Roman", serif; }
    canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    .bar { position: fixed; z-index: 2; }
    #top { top: 0; left: 0; right: 0; background: #c24a4d; }
    #bot { bottom: 0; left: 0; right: 0; background: #5588f8; }
    #panel { position: fixed; width: 9.6em; height: 30em; background: #fff; border-radius: 2.4em; z-index: 3; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: .8em 0; box-sizing: border-box; }
    .sc { writing-mode: vertical-rl; font-size: 7.4em; line-height: 1; white-space: nowrap; }
    .sc i { font-style: normal; font-size: .34em; }
    #sr { color: #c24a4d; transform: rotate(180deg); }
    #sb { color: #5588f8; }
    #pause { width: 6em; height: 6em; border-radius: 50%; background: #888; border: 0; padding: 0; position: relative; flex: none; font-size: inherit; }
    #pause::before, #pause::after { content: ""; position: absolute; top: 28%; width: 12%; height: 44%; background: #fff; border-radius: 1px; }
    #pause::before { left: 34%; }
    #pause::after { right: 34%; }
    #pause.on::before { left: 38%; top: 26%; width: 0; height: 0; background: none; border-left: 2em solid #fff; border-top: 1.4em solid transparent; border-bottom: 1.4em solid transparent; border-radius: 0; }
    #pause.on::after { display: none; }
    #ov { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: calc(var(--s)*28px); z-index: 4; background: rgba(217,217,217,.85); text-align: center; font-size: calc(var(--s)*40px); color: #222; }
    .m { display: flex; flex-direction: column; gap: calc(var(--s)*18px); align-items: stretch; }
    #ov button { font: inherit; font-size: calc(var(--s)*28px); padding: calc(var(--s)*12px) calc(var(--s)*50px); border: 5px solid #000; border-radius: calc(var(--s)*40px); background: #9ccc6f; color: #000; cursor: pointer; }
    #ov button.b { background: #5588f8; color: #fff; }
    #ov.h, .m.h { display: none; }
    @media (orientation: landscape) {
      #panel { width: 30em; height: 9.6em; flex-direction: row; padding: 0 .8em; }
      .sc { writing-mode: horizontal-tb; font-size: 4em; }
      #sr { transform: none; }
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div class="bar" id="top"></div>
  <div class="bar" id="bot"></div>
  <div id="panel">
    <div class="sc" id="sr"></div>
    <button id="pause" aria-label="Pause"></button>
    <div class="sc" id="sb"></div>
  </div>
  <div id="ov">
    <div id="msg">Ping Pong</div>
    <div class="m" id="menu">
      <button class="b" data-m="1">Contre le bot — facile</button>
      <button class="b" data-m="2">Contre le bot — difficile</button>
      <button data-m="0">2 joueurs</button>
    </div>
    <div class="m h" id="pm"><button id="res">Reprendre</button><button id="qm">Menu</button></div>
  </div>
  <script>
    const WW = 760, WH = 1780, TX = -260, TY = -690, TW = 520, TH = 1380, RR = 68, BR = 44, D = RR + BR - 8, GOAL = 3;
    const cv = document.getElementById('c'), ctx = cv.getContext('2d', { alpha: false, desynchronized: true }), P = document.getElementById('panel');
    const top_ = document.getElementById('top'), bot_ = document.getElementById('bot');
    let s = 1, dpr = 1, landscape = false;
    function resize() {
      dpr = Math.min(2, window.devicePixelRatio || 1);
      cv.width = innerWidth * dpr;
      cv.height = innerHeight * dpr;
      landscape = innerWidth > innerHeight;
      s = landscape ? Math.min(innerWidth / WH, innerHeight / WW) : Math.min(innerWidth / WW, innerHeight / WH);
      document.documentElement.style.setProperty('--s', s);
      P.style.fontSize = `${s * 10}px`;
      P.style.left = `${innerWidth / 2 - (landscape ? 150 : 368) * s}px`;
      P.style.top = `${innerHeight / 2 - (landscape ? 48 : 150) * s}px`;
      if (landscape) {
        top_.style.cssText = `left:0;top:0;bottom:0;width:${17 * s}px;height:auto`;
        bot_.style.cssText = `right:0;top:0;bottom:0;width:${17 * s}px;height:auto`;
      } else {
        top_.style.cssText = `left:0;top:0;right:0;width:auto;height:${17 * s}px`;
        bot_.style.cssText = `left:0;right:0;bottom:0;width:auto;height:${17 * s}px`;
      }
    }
    addEventListener('resize', resize);
    resize();

    const rk = [
      { x: -150, y: -715, tx: -150, ty: -715, vx: 0, vy: 0 },
      { x: 40, y: 705, tx: 40, ty: 705, vx: 0, vy: 0 },
    ];
    const lim = [
      { x0: -270, x1: 270, y0: -740, y1: -315 },
      { x0: -270, x1: 270, y0: 305, y1: 730 },
    ];
    const BOT = [null, { v: 560, e: 110 }, { v: 1100, e: 30 }];
    let mode = 0, botErr = 0, ball = { x: -20, y: 450, vx: 0, vy: 0 }, score = [0, 0], state = 'ready', prev = '', trail = [], hits = 0, serveT = 0, serveTo = 1, lastHit = -1, canHit = [true, true], toast = '', toastT = 0;
    const ov = document.getElementById('ov'), msg = document.getElementById('msg'), menu = document.getElementById('menu'), pm = document.getElementById('pm'), pb = document.getElementById('pause');
    function upd() {
      document.getElementById('sr').innerHTML = `${score[0]}<i>/${GOAL}</i>`;
      document.getElementById('sb').innerHTML = `${score[1]}<i>/${GOAL}</i>`;
    }
    upd();
    function resetBall(to) {
      hits = 0;
      trail = [];
      lastHit = -1;
      canHit = [true, true];
      serveTo = to;
      ball = { x: (Math.random() - .5) * 200, y: to === 0 ? -200 : 200, vx: 0, vy: 0 };
      serveT = .8;
      state = 'serve';
    }
    function launch() {
      const a = (Math.random() - .5) * 1.0, sp = 780;
      ball.vx = Math.sin(a) * sp;
      ball.vy = (serveTo === 0 ? -1 : 1) * Math.cos(a) * sp;
      state = 'play';
    }
    function newGame(m) {
      mode = m;
      score = [0, 0];
      upd();
      ov.classList.add('h');
      toastT = 0;
      rk[0].tx = -150;
      rk[0].ty = -715;
      rk[1].tx = 40;
      rk[1].ty = 705;
      resetBall(Math.random() < .5 ? 0 : 1);
    }
    function showMenu(t) {
      msg.innerHTML = t;
      menu.classList.remove('h');
      pm.classList.add('h');
      ov.classList.remove('h');
      pb.classList.remove('on');
    }
    menu.querySelectorAll('button').forEach((button) => {
      button.onclick = () => newGame(Number(button.dataset.m));
    });
    pb.onclick = () => {
      if (state === 'play' || state === 'serve') {
        prev = state;
        state = 'pause';
        pb.classList.add('on');
        msg.textContent = 'Pause';
        menu.classList.add('h');
        pm.classList.remove('h');
        ov.classList.remove('h');
      }
    };
    document.getElementById('res').onclick = () => {
      pb.classList.remove('on');
      ov.classList.add('h');
      state = prev;
    };
    document.getElementById('qm').onclick = () => {
      state = 'ready';
      showMenu('Ping Pong');
    };
    const ptrs = {};
    const cl = (v, a, b) => Math.max(a, Math.min(b, v));
    cv.addEventListener('pointerdown', (event) => {
      const player = mode ? 1 : (landscape ? event.clientX < innerWidth / 2 : event.clientY < innerHeight / 2) ? 0 : 1;
      ptrs[event.pointerId] = { player, sx: event.clientX, sy: event.clientY, rx: rk[player].tx, ry: rk[player].ty };
      cv.setPointerCapture(event.pointerId);
    });
    cv.addEventListener('pointermove', (event) => {
      const origin = ptrs[event.pointerId];
      if (!origin) return;
      const player = rk[origin.player], limits = lim[origin.player];
      const dx = (event.clientX - origin.sx) / s, dy = (event.clientY - origin.sy) / s;
      player.tx = cl(origin.rx + (landscape ? -dy : dx) * 1.5, limits.x0, limits.x1);
      player.ty = cl(origin.ry + (landscape ? dx : dy) * 1.5, limits.y0, limits.y1);
    });
    const end = (event) => { delete ptrs[event.pointerId]; };
    cv.addEventListener('pointerup', end);
    cv.addEventListener('pointercancel', end);
    function point(winner, text) {
      toast = text || '';
      toastT = 1.2;
      score[winner]++;
      upd();
      if (score[winner] >= GOAL) {
        state = 'ready';
        showMenu((winner === 0 ? `<span style="color:#c24a4d">${mode ? 'Le bot' : 'Rouge'}</span>` : `<span style="color:#5588f8">${mode ? 'Tu as' : 'Bleu'}</span>`) + (mode && winner === 1 ? ' gagné !' : ' gagne !'));
      } else {
        resetBall(1 - winner);
      }
    }
    function hit(i, dx) {
      const dir = i === 0 ? 1 : -1;
      hits++;
      let speed = Math.min(2000, 850 + hits * 55);
      speed = Math.min(2200, speed + Math.min(Math.max(0, rk[i].vy * dir), 800) * .35);
      const angle = cl(dx / D, -1, 1) * .6;
      ball.vy = dir * Math.cos(angle) * speed;
      ball.vx = Math.sin(angle) * speed + rk[i].vx * .2;
      ball.y = rk[i].y + dir * (Math.sqrt(Math.max(0, D * D - dx * dx)) + 2);
      lastHit = i;
      canHit[i] = false;
      canHit[1 - i] = true;
      if (i === 0 && mode) botErr = (Math.random() - .5) * 2 * BOT[mode].e;
    }
    function fold(x) {
      const lo = TX + BR, width = TW - 2 * BR;
      let u = (x - lo) % (2 * width);
      if (u < 0) u += 2 * width;
      if (u > width) u = 2 * width - u;
      return lo + u;
    }
    function botMove(dt) {
      const player = rk[0], limits = lim[0], bot = BOT[mode], move = bot.v * dt;
      let gx, gy;
      if (state === 'play' && ball.vy < 0 && canHit[0]) {
        const time = Math.max(0, (ball.y - player.y) / -ball.vy);
        gx = fold(ball.x + ball.vx * time) + botErr;
        gy = ball.y - 110;
      } else {
        gx = 0;
        gy = -640;
      }
      gx = cl(gx, limits.x0, limits.x1);
      gy = cl(gy, limits.y0, limits.y1);
      player.tx += cl(gx - player.tx, -move, move);
      player.ty += cl(gy - player.ty, -move, move);
    }
    function step(dt) {
      if (state === 'pause') return;
      if (mode && state !== 'ready') botMove(dt);
      for (let i = 0; i < 2; i++) {
        const player = rk[i], k = 1 - Math.exp(-dt * 60);
        const nx = player.x + (player.tx - player.x) * k, ny = player.y + (player.ty - player.y) * k;
        player.vx = (nx - player.x) / dt;
        player.vy = (ny - player.y) / dt;
        player.x = nx;
        player.y = ny;
      }
      if (toastT > 0) toastT -= dt;
      if (state === 'serve') {
        serveT -= dt;
        if (serveT <= 0) launch();
        return;
      }
      if (state !== 'play') return;
      ball.x += ball.vx * dt;
      ball.y += ball.vy * dt;
      trail.push({ x: ball.x, y: ball.y });
      if (trail.length > 28) trail.shift();
      for (let i = 0; i < 2; i++) {
        if (!canHit[i]) continue;
        const direction = i === 0 ? 1 : -1, dx = ball.x - rk[i].x, dy = ball.y - rk[i].y;
        if (dy * direction > -30 && dx * dx + dy * dy < D * D) hit(i, dx);
      }
      if (ball.y < TY - BR - 60) point(1, '');
      else if (ball.y > TY + TH + BR + 60) point(0, '');
      else if (ball.x < TX + BR) {
        ball.x = TX + BR;
        ball.vx = Math.abs(ball.vx) * .92;
      } else if (ball.x > TX + TW - BR) {
        ball.x = TX + TW - BR;
        ball.vx = -Math.abs(ball.vx) * .92;
      }
    }
    function rect(x, y, width, height) {
      ctx.beginPath();
      ctx.rect(x, y, width, height);
    }
    function racket(x, y, color, down) {
      ctx.lineWidth = 10;
      ctx.strokeStyle = '#000';
      ctx.fillStyle = color;
      ctx.lineJoin = 'miter';
      rect(x - 20, down ? y + 42 : y - 116, 40, 74);
      ctx.fill();
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(x, y, RR - 2, 0, 7);
      ctx.fill();
      ctx.stroke();
      ctx.save();
      ctx.beginPath();
      ctx.arc(x, y, RR - 2, 0, 7);
      ctx.clip();
      const c = down ? 31 : -31;
      ctx.lineWidth = 9;
      ctx.beginPath();
      ctx.moveTo(x - 80, y + c);
      ctx.lineTo(x + 80, y + c);
      ctx.stroke();
      ctx.restore();
    }
    function draw() {
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.fillStyle = '#d9d9d9';
      ctx.fillRect(0, 0, cv.width, cv.height);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.translate(innerWidth / 2, innerHeight / 2);
      if (landscape) ctx.rotate(-Math.PI / 2);
      ctx.scale(s, s);
      ctx.fillStyle = '#9ccc6f';
      rect(TX, TY, TW, TH);
      ctx.fill();
      ctx.fillStyle = '#fff';
      rect(-8, TY + 4, 16, TH - 8);
      ctx.fill();
      ctx.fillStyle = '#fff';
      rect(TX + 4, -10, TW - 8, 19);
      ctx.fill();
      ctx.fillStyle = '#000';
      rect(TX + 4, -12, TW - 8, 4);
      ctx.fill();
      rect(TX + 4, 8, TW - 8, 4);
      ctx.fill();
      ctx.lineWidth = 9;
      ctx.strokeStyle = '#000';
      rect(TX, TY, TW, TH);
      ctx.stroke();
      if (trail.length > 3 && state === 'play') {
        const first = trail[0], dx = ball.x - first.x, dy = ball.y - first.y, length = Math.hypot(dx, dy) || 1;
        const nx = -dy / length * 42, ny = dx / length * 42;
        ctx.fillStyle = 'rgba(182,242,122,.5)';
        ctx.beginPath();
        ctx.moveTo(first.x, first.y);
        ctx.lineTo(ball.x + nx, ball.y + ny);
        ctx.lineTo(ball.x - nx, ball.y - ny);
        ctx.closePath();
        ctx.fill();
      }
      ctx.fillStyle = 'rgba(0,80,0,.15)';
      ctx.beginPath();
      ctx.arc(ball.x + 112, ball.y, BR, 0, 7);
      ctx.fill();
      racket(rk[0].x, rk[0].y, '#c24a4d', false);
      racket(rk[1].x, rk[1].y, '#5588f8', true);
      ctx.fillStyle = '#fff';
      ctx.strokeStyle = '#000';
      ctx.lineWidth = 9;
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, BR, 0, 7);
      ctx.fill();
      ctx.stroke();
      if (toastT > 0 && toast) {
        ctx.fillStyle = '#222';
        ctx.font = 'bold 56px Georgia,serif';
        ctx.textAlign = 'center';
        ctx.fillText(toast, 0, -250);
      }
    }
    let last = performance.now();
    function loop(time) {
      const dt = Math.min(.05, (time - last) / 1000);
      last = time;
      if (dt > 0) {
        const steps = Math.max(1, Math.ceil(dt * 120));
        for (let i = 0; i < steps; i++) step(dt / steps);
      }
      draw();
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
    showMenu('Ping Pong');
  </script>
</body>
</html>
