<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Enregistrement de la mise en crédits démo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,500;0,700;1,600&display=swap">
<style>
:root{--gold:#d9ae4f;--ivory:#f3ead6;--ink:#07090c;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:var(--ink);color:var(--ivory);font-family:'Bodoni Moda',Georgia,serif}
body{display:flex;overflow:hidden}
.stage{position:relative;width:min(100%,calc(100vh*.5625));aspect-ratio:9/16;margin:auto;container-type:inline-size;background:#000;overflow:hidden}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3.5cqw;padding:7cqw;text-align:center;background:radial-gradient(ellipse at 50% 40%,rgba(74,13,28,.92),rgba(5,6,8,.98));transition:opacity .6s;z-index:2}
.ov.hide{opacity:0;pointer-events:none}
h1{margin:0;font-size:8.6cqw;font-style:italic;color:var(--gold);font-weight:600;line-height:1.1}
p{margin:0;font-size:3.8cqw;opacity:.85}
.slip{width:100%;box-sizing:border-box;border:1px solid rgba(217,174,79,.5);border-radius:3cqw;padding:4cqw;background:rgba(0,0,0,.35)}
.slip b{display:block;font-size:4.6cqw;margin:2cqw 0 1.5cqw;font-weight:600}
.chips{display:flex;gap:2cqw;justify-content:center}
button{font:600 3.5cqw 'Bodoni Moda',Georgia,serif;min-height:44px;border-radius:999px;border:1px solid var(--gold);background:transparent;color:var(--gold);padding:0 3cqw;cursor:pointer}
button[aria-pressed=true]{background:var(--gold);color:var(--ink)}
.go{background:var(--gold);color:var(--ink);padding:0 9cqw;font-size:4.6cqw}
button:focus-visible{outline:3px solid var(--ivory);outline-offset:3px}
.mute{position:absolute;top:2.5%;right:3%;min-width:44px;padding:0;z-index:3;border-color:rgba(255,255,255,.3);color:var(--ivory);font-size:5cqw}
.rp{position:absolute;bottom:2.5%;left:50%;transform:translateX(-50%);opacity:0;pointer-events:none;transition:opacity .8s;z-index:3;background:var(--gold);color:var(--ink);font-size:4.2cqw;padding:0 7cqw}
.rp{display:none!important}
.audio-hint{position:absolute;left:8%;right:8%;bottom:9%;z-index:3;color:var(--ivory);font:500 2.8cqw 'Bodoni Moda',Georgia,serif;text-shadow:0 2px 8px #000;pointer-events:none}
.audio-hint[hidden]{display:none}
</style>
</head>
<body>
<div class="stage" id="st">
<canvas id="c"></canvas>
<button class="mute" id="mu" aria-label="Couper ou activer le son">🔊</button>
<p class="audio-hint" id="audio-hint">Si la voix ne démarre pas, touchez 🔊 pour relancer l’animation complète avec le son.</p>
<button class="rp" id="rp" type="button">Rejouer</button>
<div class="ov" id="ov">
 <p style="letter-spacing:.4em;font-size:3cqw;color:var(--gold)" id="game-brand">♠ ♥ CHICAGO FUN ♦ ♣</p><h1 id="game-title">Chicago Fun</h1>
 <p>Mise de crédits démo enregistrée pour cette partie · animation symbolique</p>
 <div class="slip">
  <b>Joueur 1</b><div class="chips" id="ca" role="group" aria-label="Mise du joueur 1"></div>
  <b>Joueur 2</b><div class="chips" id="cb" role="group" aria-label="Mise du joueur 2"></div>
  <p id="tot" style="margin-top:3cqw"></p>
 </div>
 <button class="go" id="go" type="button">Lancer la simulation</button>
</div>
</div>
<script>
const BET={a:5000,b:8000};
const cv=document.getElementById('c'),g=cv.getContext('2d'),st=document.getElementById('st'),ov=document.getElementById('ov');
let K=1;function fit(){const r=cv.getBoundingClientRect(),d=Math.min(2,devicePixelRatio||1);cv.width=r.width*d;cv.height=r.height*d;K=cv.width/360}
addEventListener('resize',fit);fit();
const eur=n=>n.toLocaleString('fr-FR')+' crédits démo';
function chips(id,k){const w=document.getElementById(id);[500,1000,5000,8000].forEach(v=>{const b=document.createElement('button');b.type='button';b.textContent=eur(v);b.dataset.v=v;b.onclick=()=>{BET[k]=v;upd()};w.appendChild(b)})}
function upd(){[['ca','a'],['cb','b']].forEach(([i,k])=>[...document.getElementById(i).children].forEach(b=>b.setAttribute('aria-pressed',+b.dataset.v===BET[k])));document.getElementById('tot').textContent='Total déposé : '+eur(BET.a+BET.b)}
chips('ca','a');chips('cb','b');upd();

const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)),sm=x=>{x=cl(x);return x*x*(3-2*x)};
function kf(k,t){for(let i=0;i<k.length-1;i++)if(t<=k[i+1][0]){const u=sm((t-k[i][0])/(k[i+1][0]-k[i][0]));return k[i][1]+(k[i+1][1]-k[i][1])*u}return k[k.length-1][1]}
const MX=[[0,290],[6,290],[7.6,585],[8.8,585],[10,712],[11.4,712],[12.2,660],[99,660]],CAMK=[[0,0],[6,0],[7.6,300],[8.8,340],[10,560],[99,560]];
const MDX=[[0,12],[1.8,12],[2.3,88],[2.9,88],[3.4,45],[3.6,45],[4.2,88],[4.9,88],[5.4,45],[5.9,45],[6,2],[6.6,34],[10.4,34],[11.2,76],[11.5,76],[12.1,12],[99,12]];
const MDY=[[0,65],[1.8,65],[2.3,85],[2.9,85],[3.4,62],[3.6,62],[4.2,85],[4.9,85],[5.4,62],[5.9,62],[6,66],[6.6,82],[10.4,82],[11.2,45],[11.5,45],[12.1,65],[99,65]];
const ADX=[[0,8],[1.2,8],[1.9,92],[2.9,92],[3.4,8],[99,8]],BDX=[[0,8],[3.3,8],[3.8,42],[4.9,42],[5.4,8],[99,8]];
const doorA=t=>t<11.8?sm((t-9.2)/1.2):1-sm((t-12)/1);
const DC={x:770,y:300,R:120},FL=470;
let CAM=0,DRs={x:200,y:300},sp=[];
const circ=(x,y,r)=>{g.beginPath();g.arc(x,y,r,0,7)};
const rch=(sx,sy,hx,hy)=>{const dx=hx-sx,dy=hy-sy,d=Math.hypot(dx,dy),m=Math.min(d,121);return d?[sx+dx/d*m,sy+dy/d*m]:[hx,hy]};

/* décor */
function room(){
 const w=g.createLinearGradient(0,0,0,FL);w.addColorStop(0,'#12060b');w.addColorStop(1,'#3b0e1a');g.fillStyle=w;g.fillRect(-20,0,1100,FL);
 for(let x=0;x<1000;x+=120){g.fillStyle='rgba(255,255,255,.03)';g.fillRect(x+10,110,100,320);g.strokeStyle='rgba(217,174,79,.28)';g.lineWidth=1.5;g.strokeRect(x+10,110,100,320)}
 g.fillStyle='#d9ae4f';g.fillRect(-20,436,1100,3);g.fillStyle='#0d0407';g.fillRect(-20,440,1100,30);
 const c=g.createLinearGradient(0,FL,0,640);c.addColorStop(0,'#5a0f22');c.addColorStop(1,'#1a0509');g.fillStyle=c;g.fillRect(-20,FL,1100,200);
 g.fillStyle='#d9ae4f';g.fillRect(-20,FL,1100,2);
 g.fillStyle='rgba(217,174,79,.1)';for(let x=0;x<1000;x+=70)for(let r=0;r<2;r++){g.save();g.translate(x+(r?35:0),500+r*45);g.rotate(.785);g.fillRect(-9,-9,18,18);g.restore()}
 g.globalCompositeOperation='lighter';
 [90,300,520,770,950].forEach(x=>{const r=g.createRadialGradient(x,20,0,x,20,170);r.addColorStop(0,'rgba(255,225,160,.3)');r.addColorStop(1,'rgba(255,225,160,0)');g.fillStyle=r;g.fillRect(x-170,0,340,200);
  const l=g.createLinearGradient(0,20,0,FL);l.addColorStop(0,'rgba(255,225,160,.12)');l.addColorStop(1,'rgba(255,225,160,0)');g.fillStyle=l;g.beginPath();g.moveTo(x-12,20);g.lineTo(x+12,20);g.lineTo(x+110,FL);g.lineTo(x-110,FL);g.fill()});
 g.globalCompositeOperation='source-over';
 g.fillStyle='#f3ead6';[90,300,520,770,950].forEach(x=>g.fillRect(x-14,14,28,6));
 g.textAlign='center';g.fillStyle='#d9ae4f';g.font="italic 600 20px 'Bodoni Moda',Georgia,serif";g.fillText('Caisse',220,230);g.fillText('Salle forte',DC.x,150);
}
function counter(){const c=g.createLinearGradient(0,380,0,FL);c.addColorStop(0,'#4a2a18');c.addColorStop(1,'#25130a');g.fillStyle=c;g.fillRect(170,382,100,88);
 g.fillStyle='#8a5a32';g.fillRect(164,376,112,8);g.fillStyle='#d9ae4f';g.fillRect(164,384,112,2);g.fillStyle='rgba(0,0,0,.35)';g.fillRect(170,386,100,6)}

/* personnages */
function arm(sx,sy,hx,hy,col,skin){const l=62,dx=hx-sx,dy=hy-sy,d=Math.min(Math.hypot(dx,dy),121),a=Math.atan2(dy,dx),h=Math.sqrt(Math.max(0,l*l-(d/2)**2)),mx=sx+Math.cos(a)*d/2-Math.sin(a)*h,my=sy+Math.sin(a)*d/2+Math.cos(a)*h;
 g.strokeStyle=col;g.lineWidth=13;g.lineCap='round';g.lineJoin='round';g.beginPath();g.moveTo(sx,sy);g.lineTo(mx,my);g.lineTo(sx+Math.cos(a)*d,sy+Math.sin(a)*d);g.stroke();g.fillStyle=skin;circ(sx+Math.cos(a)*d+2,sy+Math.sin(a)*d+1,7);g.fill()}
function person(x,dir,o){
 g.save();g.translate(x,0);g.scale(dir,1);
 const amp=o.amp||0,ph=o.ph||0,bob=Math.abs(Math.sin(ph))*2.5*amp;
 g.fillStyle='rgba(0,0,0,.4)';g.beginPath();g.ellipse(0,FL+2,34,7,0,0,7);g.fill();
 g.lineCap='round';
 [1,-1].forEach(s=>{const a=Math.sin(ph+(s>0?0:Math.PI))*.5*amp,fx=Math.sin(a)*104,fy=358-bob+Math.cos(a)*104;g.strokeStyle=s>0?o.pants:'#0c0e12';g.lineWidth=16;g.beginPath();g.moveTo(0,358-bob);g.lineTo(fx,fy);g.stroke();g.fillStyle='#08080a';g.beginPath();g.ellipse(fx+8,fy+3,16,6,0,0,7);g.fill()});
 g.translate(0,-bob+Math.sin(performance.now()/650+x)*.8);
 g.strokeStyle=o.suit;g.lineWidth=12;g.globalAlpha=.7;g.beginPath();g.moveTo(-3,290);g.lineTo(-6-Math.sin(ph)*8*amp,350);g.stroke();g.globalAlpha=1;
 const tg=g.createLinearGradient(-22,0,22,0);tg.addColorStop(0,o.dark);tg.addColorStop(1,o.suit);g.fillStyle=tg;g.beginPath();g.moveTo(-19,282);g.quadraticCurveTo(0,273,19,282);g.lineTo(22,364);g.lineTo(-22,364);g.closePath();g.fill();
 g.fillStyle='#f3ead6';g.beginPath();g.moveTo(8,284);g.lineTo(17,284);g.lineTo(19,340);g.lineTo(11,340);g.fill();g.fillStyle=o.tie;g.fillRect(12,290,4,40);
 if(o.badge){g.fillStyle='#d9ae4f';circ(5,316,3.5);g.fill()}
 g.fillStyle=o.skin;g.fillRect(-3,264,9,20);g.beginPath();g.arc(3,252,18,0,7);g.fill();g.beginPath();g.moveTo(20,250);g.lineTo(26,258);g.lineTo(19,259);g.fill();
 g.fillStyle=o.hair;g.beginPath();g.arc(2,250,19.5,Math.PI,6.6);g.fill();circ(-7,256,12);g.fill();
 g.fillStyle='rgba(0,0,0,.25)';circ(-1,257,4);g.fill();
 if(o.guard){g.fillStyle='#0b0d10';g.fillRect(-18,236,42,6);g.beginPath();g.arc(2,238,19,Math.PI,0);g.fill();g.fillStyle='#d9ae4f';circ(8,226,3);g.fill();g.fillStyle='#000';g.beginPath();g.roundRect(6,246,17,7,3);g.fill()}
 else{g.fillStyle='#1a1210';circ(12+(o.look||0)*2,251,1.8);g.fill()}
 g.strokeStyle='rgba(60,20,20,.6)';g.lineWidth=1.3;g.beginPath();g.moveTo(11,262);g.lineTo(18,262);g.stroke();
 if(o.talk){g.fillStyle='#3a0d12';g.beginPath();g.ellipse(15,263,3.5,1+Math.abs(Math.sin(o.talk*14))*2.6,0,0,7);g.fill()}
 const h=o.hand?rch(0,288,(o.hand[0]-x)*dir,o.hand[1]+bob):[10,352];arm(2,290,h[0],h[1],o.suit,o.skin);
 g.restore();
}
const MAN={suit:'#1b1f26',dark:'#0e1014',pants:'#14171c',tie:'#b0243f',skin:'#d9ad88',hair:'#8a8a90',badge:1};
const PA={suit:'#8a2b44',dark:'#5a1a2c',pants:'#1a1d24',tie:'#d9ae4f',skin:'#e0b894',hair:'#2b1a12'};
const PB={suit:'#2d6a55',dark:'#1b4638',pants:'#20242b',tie:'#f3ead6',skin:'#b98462',hair:'#c9a867'};
const GU={suit:'#101419',dark:'#06080a',pants:'#0b0d10',tie:'#b0243f',skin:'#d6aa86',hair:'#111',guard:1};

/* argent, mallette */
function bundle(x,y){g.save();g.translate(x,y);g.fillStyle='#3f9a63';g.strokeStyle='#d9ae4f';g.lineWidth=1.2;g.beginPath();g.roundRect(-17,-7,34,14,2);g.fill();g.stroke();g.fillStyle='#e8d9a8';g.fillRect(-4,-7,8,14);g.restore()}
function suitcase(x,y,n,open){g.save();g.translate(x,y);
 if(open&&n){g.fillStyle='#3f9a63';for(let i=0;i<n;i++)g.fillRect(-22,-4-i*4,44,5)}
 g.strokeStyle='#2a1c12';g.lineWidth=4;g.beginPath();g.arc(0,0,10,Math.PI,0);g.stroke();
 const c=g.createLinearGradient(0,0,0,34);c.addColorStop(0,'#2b201a');c.addColorStop(1,'#120d0a');g.fillStyle=c;g.beginPath();g.roundRect(-26,0,52,34,4);g.fill();g.strokeStyle='#d9ae4f';g.lineWidth=1.5;g.stroke();
 g.fillStyle='#d9ae4f';g.fillRect(-4,6,8,6);g.fillRect(-22,15,44,1.2);g.restore()}

/* coffre */
function leaf(R,t){
 const c=g.createConicGradient(.6,0,0);[[0,'#6b747d'],[.15,'#cfd6dd'],[.3,'#4a525a'],[.5,'#8f98a1'],[.65,'#363d44'],[.8,'#bcc4cc'],[1,'#6b747d']].forEach(s=>c.addColorStop(...s));
 g.fillStyle=c;circ(0,0,R);g.fill();g.strokeStyle='#1b2025';g.lineWidth=R*.04;g.stroke();
 g.strokeStyle='rgba(0,0,0,.45)';g.lineWidth=R*.03;circ(0,0,R*.84);g.stroke();circ(0,0,R*.6);g.stroke();
 g.fillStyle='#d9ae4f';for(let i=0;i<12;i++){circ(Math.cos(i*Math.PI/6)*R*.92,Math.sin(i*Math.PI/6)*R*.92,R*.025);g.fill()}
 g.save();g.rotate(6.5*sm((t-13)/1.4));g.strokeStyle='#d9ae4f';g.lineCap='round';g.lineWidth=R*.07;
 for(let i=0;i<3;i++){g.rotate(Math.PI*2/3);g.beginPath();g.moveTo(0,0);g.lineTo(0,-R*.5);g.stroke();circ(0,-R*.5,R*.05);g.fillStyle='#d9ae4f';g.fill()}
 g.restore();g.fillStyle='#262c33';circ(0,0,R*.15);g.fill();g.strokeStyle='#d9ae4f';g.lineWidth=R*.04;g.stroke();
 const h=g.createRadialGradient(-R*.4,-R*.4,0,-R*.4,-R*.4,R*1.1);h.addColorStop(0,'rgba(255,255,255,.22)');h.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=h;circ(0,0,R);g.fill();
}
function vault(t){
 const {x,y,R}=DC,A=doorA(t);g.save();g.translate(x,y);
 const pl=g.createLinearGradient(0,-150,0,150);pl.addColorStop(0,'#2d3238');pl.addColorStop(1,'#16191d');g.fillStyle=pl;g.beginPath();g.roundRect(-150,-140,300,280,14);g.fill();g.strokeStyle='#3d444c';g.lineWidth=3;g.stroke();
 g.fillStyle='#59616a';[[-135,-125],[135,-125],[-135,125],[135,125]].forEach(p=>{circ(p[0],p[1],4);g.fill()});
 const fr=g.createConicGradient(0,0,0);[[0,'#2c3238'],[.25,'#59616a'],[.5,'#2c3238'],[.75,'#59616a'],[1,'#2c3238']].forEach(q=>fr.addColorStop(...q));
 g.fillStyle=fr;circ(0,0,R*1.18);g.fill();g.strokeStyle='#d9ae4f';g.lineWidth=R*.035;g.stroke();
 g.fillStyle='#080504';circ(0,0,R*1.03);g.fill();
 const gi=g.createRadialGradient(0,0,0,0,0,R*1.03);gi.addColorStop(0,'rgba(255,214,120,'+(.1+.8*A)+')');gi.addColorStop(.6,'rgba(120,80,30,'+(.15+.4*A)+')');gi.addColorStop(1,'rgba(8,5,4,0)');g.fillStyle=gi;circ(0,0,R*1.03);g.fill();
 g.save();circ(0,0,R);g.clip();g.strokeStyle='rgba(217,174,79,'+(.1+.45*A)+')';g.lineWidth=1;
 for(let i=-4;i<=4;i++)for(let j=-4;j<=4;j++)g.strokeRect(i*R*.22-R*.09,j*R*.22-R*.09,R*.18,R*.18);
 g.fillStyle='#d9ae4f';g.fillRect(-R,64,2*R,3);
 if(t>=11.5)suitcase(788-x,330-y,2,0);
 g.restore();
 g.save();g.translate(-R,0);g.scale(1-.9*A,1);g.translate(R,0);leaf(R,t);g.restore();
 for(let k=0;k<8;k++){const e=sm((t-13.3-k*.06)/.3);if(e<=0)continue;g.save();g.rotate(k*Math.PI/4);g.fillStyle='#e3bd62';g.fillRect(R*.97,-R*.05,R*.22*e,R*.1);g.restore()}
 const lc=t<12?[255,180,60]:t<13.8?[255,60,70]:[80,255,160];g.fillStyle='rgb('+lc+')';circ(0,-R*1.34,R*.07);g.fill();
 g.globalCompositeOperation='lighter';const lg=g.createRadialGradient(0,-R*1.34,0,0,-R*1.34,R*.35);lg.addColorStop(0,'rgba('+lc+',.6)');lg.addColorStop(1,'rgba('+lc+',0)');g.fillStyle=lg;g.fillRect(-R*.4,-R*1.75,R*.8,R*.8);
 if(t>13){const u=t-13;g.strokeStyle='rgba(255,220,150,'+Math.exp(-u*3)*.7+')';g.lineWidth=R*.06;circ(0,0,R*(1.2+u*1.6));g.stroke()}
 g.restore();
}

/* lasers, chien, poussière */
const DUST=Array.from({length:40},()=>({x:Math.random()*360,y:Math.random()*470,v:3+Math.random()*5,p:Math.random()*6}));
function lasers(t){const al=t<8.5?1:cl(1-(t-8.5)/.6),x1=620,x2=690,p=performance.now(),ys=[];for(let i=0;i<9;i++)ys.push(172+i*30);
 g.save();g.fillStyle='#2b3037';g.strokeStyle='#59616a';g.lineWidth=1;[x1-14,x2].forEach(x=>{g.fillRect(x,150,14,300);g.strokeRect(x,150,14,300)});
 g.fillStyle=al>0?'#ff3040':'#40ff90';ys.forEach(y=>{circ(x1-7,y,2.5);g.fill();circ(x2+7,y,2.5);g.fill()});
 if(al>0){const f=.85+.15*Math.sin(p/35);g.globalCompositeOperation='lighter';
  ys.forEach(y=>{g.fillStyle='rgba(255,40,70,'+.2*al*f+')';g.fillRect(x1-7,y-5,x2-x1+14,10);g.fillStyle='rgba(255,225,225,'+al+')';g.fillRect(x1-7,y-.8,x2-x1+14,1.6)});
  const sy=172+(Math.sin(p/450)*.5+.5)*240;g.fillStyle='rgba(255,60,80,'+.5*al+')';g.fillRect(x1-7,sy-3,x2-x1+14,6);g.fillStyle='rgba(255,255,255,'+al+')';g.fillRect(x1-7,sy-.8,x2-x1+14,1.6)}
 g.restore()}
function dog(x,t,s){g.save();g.translate(x,FL);g.scale(s,1);const br=Math.sin(t*3.5),wg=Math.sin(t*10);
 g.fillStyle='rgba(0,0,0,.4)';g.beginPath();g.ellipse(4,2,40,6,0,0,7);g.fill();
 g.lineCap='round';g.strokeStyle='#2a190d';g.lineWidth=7;[[-22,-2],[-13,3],[17,-2],[26,3]].forEach(q=>{g.beginPath();g.moveTo(q[0],-30);g.lineTo(q[0]+q[1],-3);g.stroke()});
 g.strokeStyle='#1a0f08';g.lineWidth=6;g.beginPath();g.moveTo(-30,-46);g.quadraticCurveTo(-46,-54+wg*5,-52,-38+wg*12);g.stroke();
 const bg=g.createLinearGradient(0,-60,0,-26);bg.addColorStop(0,'#1a1008');bg.addColorStop(.55,'#4a2d17');bg.addColorStop(1,'#7a4f2a');g.fillStyle=bg;g.beginPath();g.ellipse(0,-44,33,15+br*.5,0,0,7);g.fill();
