<style>

.rp{display:none!important}
.audio-hint{position:absolute;left:8%;right:8%;bottom:9%;z-index:3;color:var(--ivory);font:500 2.8cqw 'Bodoni Moda',Georgia,serif;text-shadow:0 2px 8px #000;pointer-events:none}
